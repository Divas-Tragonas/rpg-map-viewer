      if (String(id).startsWith('pl_')) {
        const R = rTokenSizeOverride.current[id] ?? 22;
        newPos[id] = { x: snapCC(p.x + R, gox) - R, y: snapCC(p.y + R, goy) - R };
      } else {
        newPos[id] = { x: snapCC(p.x, gox), y: snapCC(p.y, goy) };
      }
    }
    rPos.current = newPos;
    setPos(newPos);
    _broadcastState({});
  }, [_broadcastState]);

  const sizeAllTokens = useCallback(() => {
    const gs = rGridSize.current;
    if (gs <= 0) return;
    const R = Math.round(gs * 0.45);
    const overrides = {};
    const s2 = rStruct.current;
    if (s2) {
      s2.enemyZones.forEach(zone => zone.enemies.forEach(en => { overrides[en.id] = R; }));
    }
    rPlayers.current.forEach(pl => { overrides[`pl_${pl.id}`] = R; });
    rTokenSizeOverride.current = overrides;
    setTokenSizeOverride(overrides);
    _broadcastState({ tokenSizeOverride: overrides });
  }, [_broadcastState]);

  const addPlayer = () => {
    const name = newPName.trim(); if (!name) return;
    const m = mediaRef.current;
    let mw = 1920, mh = 1080;
    if (m?.tagName === 'IMG'   && m.naturalWidth) { mw = m.naturalWidth;  mh = m.naturalHeight; }
    if (m?.tagName === 'VIDEO' && m.videoWidth)   { mw = m.videoWidth;    mh = m.videoHeight; }
    // Calcular el centro visible del mapa en este momento
    const canvas = canvasRef.current;
    let cx = mw/2, cy = mh/2;
    if (canvas && canvas.clientWidth) {
      const W = canvas.clientWidth, H = canvas.clientHeight;
      const sc = Math.min(W/mw, H/mh) * rZoom.current;
      const pan = rPanOffset.current;
      const ox = (W - mw*sc)/2 + pan.x;
      const oy = (H - mh*sc)/2 + pan.y;
      cx = Math.max(44, Math.min(mw - 44, (W/2 - ox) / sc));
      cy = Math.max(44, Math.min(mh - 44, (H/2 - oy) / sc));
    }
    const plR = rGridAutoSize.current ? Math.round(rGridSize.current * 0.45) : 22;
    const hpMax = Math.max(1, newPHpMax || 20);
    const pl = { id: Date.now(), name, color: newPColor, x: cx - plR, y: cy - plR, visible: true, hp: hpMax, hpMax };
    const nsPlayers = [...rPlayers.current, pl];
    rPlayers.current = nsPlayers;
    setPlayers(nsPlayers);
    const np = { x: pl.x, y: pl.y };
    rPos.current[`pl_${pl.id}`] = np;
    setPos(p => ({ ...p, [`pl_${pl.id}`]: np }));
    if (rGridAutoSize.current) {
      const overrides = { ...rTokenSizeOverride.current, [`pl_${pl.id}`]: plR };
      rTokenSizeOverride.current = overrides;
      setTokenSizeOverride(overrides);
      _broadcastState({ tokenSizeOverride: overrides });
    } else {
      _broadcastState({});
    }
    setNewPName('');
  };

  const removePlayer = id => {
    setPlayers(ps => { const ns = ps.filter(p => p.id !== id); rPlayers.current = ns; return ns; });
    setPos(p => { const n = {...p}; delete n[`pl_${id}`]; return n; });
  };

  const adjustPlayerHp = (id, delta) => {
    const updated = rPlayers.current.map(pl =>
      pl.id === id ? { ...pl, hp: Math.max(0, Math.min(pl.hpMax, (pl.hp ?? pl.hpMax) + delta)) } : pl
    );
    rPlayers.current = updated;
    setPlayers(updated);
    _broadcastState({});
  };

  const loadParty = () => {
    const m = mediaRef.current;
    let mw = 1920, mh = 1080;
    if (m?.tagName === 'IMG'   && m.naturalWidth) { mw = m.naturalWidth;  mh = m.naturalHeight; }
    if (m?.tagName === 'VIDEO' && m.videoWidth)   { mw = m.videoWidth;    mh = m.videoHeight; }
    const canvas = canvasRef.current;
    let cx = mw / 2, cy = mh / 2;
    if (canvas && canvas.clientWidth) {
      const W = canvas.clientWidth, H = canvas.clientHeight;
      const sc = Math.min(W / mw, H / mh) * rZoom.current;
      const pan = rPanOffset.current;
      const ox = (W - mw * sc) / 2 + pan.x;
      const oy = (H - mh * sc) / 2 + pan.y;
      cx = Math.max(44, Math.min(mw - 44, (W / 2 - ox) / sc));
      cy = Math.max(44, Math.min(mh - 44, (H / 2 - oy) / sc));
    }
    const plR = rGridAutoSize.current ? Math.round(rGridSize.current * 0.45) : 22;
    const spacing = plR * 2 + 12;
    const totalW = spacing * (DEFAULT_PARTY.length - 1);
    const baseX = cx - totalW / 2;
    const now = Date.now();
    const newPlayers = DEFAULT_PARTY.map((def, i) => ({
      id: now + i,
      name: def.name,
      color: def.color,
      x: baseX + i * spacing - plR,
      y: cy - plR,
      visible: true,
      hp: def.hpMax,
      hpMax: def.hpMax,
    }));
    const nsPlayers = [...rPlayers.current, ...newPlayers];
    rPlayers.current = nsPlayers;
    setPlayers(nsPlayers);
    const newPos = {};
    newPlayers.forEach(pl => { newPos[`pl_${pl.id}`] = { x: pl.x, y: pl.y }; });
    rPos.current = { ...rPos.current, ...newPos };
    setPos(p => ({ ...p, ...newPos }));
    if (rGridAutoSize.current) {
      const overrides = { ...rTokenSizeOverride.current };
      newPlayers.forEach(pl => { overrides[`pl_${pl.id}`] = plR; });
      rTokenSizeOverride.current = overrides;
      setTokenSizeOverride(overrides);
      _broadcastState({ tokenSizeOverride: overrides });
    } else {
      _broadcastState({});
    }
  };

  const clearDrawing = () => {
    const oc = drawCanvasRef.current; if (!oc) return;
    oc.getContext('2d').clearRect(0, 0, oc.width, oc.height);
    strokeHistoryRef.current = []; setCanUndo(false);
    if (bcRef.current) bcRef.current.postMessage({ type: 'CLEAR_DRAW' });
    _broadcastState({});
  };


  // ── Deshacer último trazo ─────────────────────────────────────────────
  const undoStroke = useCallback(() => {
    const hist = strokeHistoryRef.current;
    if (hist.length === 0) return;
    hist.pop();
    setCanUndo(hist.length > 0);
    const oc = drawCanvasRef.current; if (!oc) return;
    const ctx2 = oc.getContext('2d');
    ctx2.clearRect(0, 0, oc.width, oc.height);
    for (const stroke of hist) replayStroke(ctx2, stroke);
    if (bcRef.current) bcRef.current.postMessage({ type: 'UNDO_DRAW', strokeHistory: [...hist] });
  }, []);

  // ── Guardar sesión ────────────────────────────────────────────────────
  const saveSession = useCallback(() => {
    const oc = drawCanvasRef.current;
    const state = {
      version: '2.1',
      vis: rVis.current, pos: rPos.current, zoom: rZoom.current,
      panOffset: rPanOffset.current, players: rPlayers.current,
      conditions: rConditions.current, defeated: rDefeated.current,
      paintedZones: rPaintedZones.current,
      strokeHistory: strokeHistoryRef.current,
      gridVisible: rGridVisible.current, gridSize: rGridSize.current, gridSnap: rGridSnap.current,
      gridLineWidth: rGridLineWidth.current, gridOriginX: rGridOriginX.current, gridOriginY: rGridOriginY.current,
      drawCanvas: oc && oc.width > 1 ? oc.toDataURL('image/png') : null,
    };
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'sesion-rpg.json'; a.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }, []);

  // ── Cargar sesión ─────────────────────────────────────────────────────
  const loadSession = useCallback(async (file) => {
    try {
      const state = JSON.parse(await file.text());
      if (state.vis)           { rVis.current = state.vis;         setVis(state.vis); }
      if (state.pos)           { rPos.current = state.pos;         setPos(state.pos); }
      if (state.zoom)          { rZoom.current = state.zoom;        setZoom(state.zoom); }
      if (state.panOffset)     { rPanOffset.current = state.panOffset; }
      if (state.players)       { rPlayers.current = state.players;  setPlayers(state.players); }
      if (state.conditions)    { rConditions.current = state.conditions; setConditions(state.conditions); }
      if (state.defeated)      { rDefeated.current = state.defeated; setDefeated(state.defeated); }
      if (state.paintedZones)  { rPaintedZones.current = state.paintedZones; setPaintedZones(state.paintedZones); }
      if (state.strokeHistory) { strokeHistoryRef.current = state.strokeHistory; setCanUndo(state.strokeHistory.length > 0); }
      if (state.gridVisible !== undefined) { rGridVisible.current = state.gridVisible; setGridVisible(state.gridVisible); }
      if (state.gridSize)      { rGridSize.current = state.gridSize; setGridSize(state.gridSize); }
      if (state.gridSnap      !== undefined) { rGridSnap.current      = state.gridSnap;      setGridSnap(state.gridSnap); }
      if (state.gridLineWidth !== undefined) { rGridLineWidth.current = state.gridLineWidth; setGridLineWidth(state.gridLineWidth); }
      if (state.gridOriginX   !== undefined) { rGridOriginX.current   = state.gridOriginX;   setGridOriginX(state.gridOriginX); }
      if (state.gridOriginY   !== undefined) { rGridOriginY.current   = state.gridOriginY;   setGridOriginY(state.gridOriginY); }
      if (state.drawCanvas) {
        const oc = drawCanvasRef.current;
        if (oc) {
          const ctx2 = oc.getContext('2d');
          ctx2.clearRect(0, 0, oc.width, oc.height);
          for (const stroke of (state.strokeHistory || [])) replayStroke(ctx2, stroke);
        }
      }
      _broadcastState({});
    } catch (err) { console.error('Error cargando sesión:', err); }
  }, [_broadcastState]);

  // ── Lanzar un hechizo a lo largo de una trayectoria abierta ─────────
  const addSpell = (type) => {
    if (!spellMenu) return;
    const sp = { id: Date.now().toString(), type, points: spellMenu.points, startTime: performance.now() };
    const ns3 = [...rActiveSpells.current, sp];
    rActiveSpells.current = ns3; setActiveSpells(ns3);
    if (bcRef.current) bcRef.current.postMessage({ type: 'SPELL', spell: { ...sp, startTime: 0 } });
    setSpellMenu(null);
  };

  const deleteLayer = useCallback((id, kind) => {
    setStruct(s => {
      if (!s) return s;
      let ns;
      if (kind === 'zone') {
        ns = { ...s, zonasLayers: s.zonasLayers.filter(l => l.id !== id) };
      } else if (kind === 'enemy') {
        ns = { ...s, enemyZones: s.enemyZones.map(z => ({ ...z, enemies: z.enemies.filter(e => e.id !== id) })) };
      } else if (kind === 'extra') {
        ns = { ...s, extras: { ...s.extras, children: s.extras.children.filter(l => l.id !== id) } };
      } else return s;
      rStruct.current = ns; rStruct2.current = ns;
      return ns;
    });
    setVis(v  => { const n = {...v};  delete n[id]; rVis.current = n; return n; });
    setPos(p  => { const n = {...p};  delete n[id]; rPos.current = n; return n; });
    setLayerImages(li => { const n = {...li}; delete n[id]; rLayerImages.current = n; return n; });
  }, []);

  const toggleVis  = id => {
    const nvTv = { ...rVis.current, [id]: !rVis.current[id] };
    rVis.current = nvTv;
    setVis(nvTv);
    _broadcastState({});
  };
  const toggleZone = id => setExpanded(e => ({ ...e, [id]: !e[id] }));
  const onDrop = (e, t) => { e.preventDefault(); const f = e.dataTransfer.files[0]; if (f) t === 'bg' ? loadBg(f) : loadPSD(f); };

  // Open player window (Change #5)
  const openPlayerWindow = () => {
    const url = location.href.split('?')[0] + '?mode=player';
    window.open(url, '_blank', 'width=1280,height=720');
  };


  // ── Atajos de teclado: 1-4 herramientas + Ctrl+Z ─────────────────────
  useEffect(() => {
    if (isPlayerWindow) return;
    const handler = (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
      if (e.ctrlKey && (e.key === 'z' || e.key === 'Z')) { e.preventDefault(); undoStroke(); return; }
      if (e.key === 'Escape' && cinematicActiveRef.current) { skipBossIntro(); return; }
      if (e.ctrlKey) return;
      if      (e.key === '1') setDrawTool(t => t === 'pen'     ? 'none' : 'pen');
      else if (e.key === '2') setDrawTool(t => t === 'eraser'  ? 'none' : 'eraser');
      else if (e.key === '3') setDrawTool(t => t === 'shape'   ? 'none' : 'shape');
      else if (e.key === '4') {
        setDrawTool(t => {
          const nt = t === 'pointer' ? 'none' : 'pointer';
          if (nt === 'none' && bcRef.current) bcRef.current.postMessage({ type: 'POINTER', pos: null });
          return nt;
        });
      }
    };
    window.addEventListener('keydown', handler);
    return () => window.removeEventListener('keydown', handler);
  }, [isPlayerWindow, undoStroke]);

  // ── Timer de resaltado: 3.5s auto-off cuando no está bloqueado ─────────
  useEffect(() => {
    if (!enemyHighlight) { highlightStartRef.current = null; return; }
    highlightStartRef.current = performance.now();
    if (highlightLocked) return; // sin timer si está bloqueado
    const timer = setTimeout(() => {
      setEnemyHighlight(false); rEnemyHighlight.current = false; _broadcastState({});
    }, 3500);
    return () => clearTimeout(timer);
  }, [enemyHighlight, highlightLocked, _broadcastState]);

  // Sync zoom to player when changed
  useEffect(() => {
    _broadcastState({});
  }, [zoom]);

  const activeCount = useMemo(() => struct?.enemyZones.reduce((s,z) => s + z.enemies.filter(en => vis[en.id]).length, 0) || 0, [struct, vis]);
  const layerImagesCount = useMemo(() => Object.keys(layerImages).length, [layerImages]);

  // ── PLAYER WINDOW RENDER ─────────────────────────────────────────────────
  if (isPlayerWindow) {
    return (
      <div style={{ width:'100vw', height:'100vh', background:'#000', position:'relative', overflow:'hidden' }}>
        <div ref={stageRef} style={{ position:'absolute', inset:0 }}/>
        <canvas ref={canvasRef}
          style={{ position:'absolute', inset:0, width:'100%', height:'100%', background:'transparent' }}
          onMouseDown={()=>{}} onMouseMove={()=>{}} onMouseUp={()=>{}} onMouseLeave={()=>{}}/>
        {/* Overlay negro para transición entre mapas */}
        <div ref={bgTransitionRef} style={{ position:'absolute', inset:0, background:'#000', zIndex:8, opacity:0, transition:'opacity 0.5s ease', pointerEvents:'none' }}/>
        {!playerReady && (
          <div style={{ position:'absolute', inset:0, display:'flex', alignItems:'center', justifyContent:'center', background:'rgba(0,0,0,0.9)', color:'#8b949e', flexDirection:'column', gap:16 }}>
            <Layers size={40} color="#21262d"/>
            <div style={{ fontSize:18, color:'#e6edf3', fontWeight:600 }}>RPG Map Viewer</div>
            <div style={{ fontSize:13 }}>Esperando al Dungeon Master...</div>
          </div>
        )}
      </div>
    );
  }

  // ── DM WINDOW RENDER ─────────────────────────────────────────────────────
  return (
    <>
    <div style={{ display:'flex', height:'100vh', background:C.bg, color:C.text, fontFamily:"-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif", fontSize:14, overflow:'hidden' }}>

      {/* ══ PANEL IZQUIERDO ══ */}
      <div style={{ width:300, minWidth:300, background:C.panel, borderRight:`1px solid ${C.border}`, display:'flex', flexDirection:'column', overflow:'hidden' }}>
        <div style={{ padding:'14px 16px 11px', borderBottom:`1px solid ${C.border}`, background:C.dark }}>
          <div style={{ display:'flex', alignItems:'center', gap:8, marginBottom:3 }}>
            <Layers size={15} color={C.accent}/>
            <span style={{ fontWeight:700, color:C.accent, fontSize:13, letterSpacing:'0.1em', textTransform:'uppercase' }}>RPG Map Viewer</span>
            <button
              onClick={() => setAppMode(m => m === 'map' ? 'expositor' : 'map')}
              title={appMode === 'map' ? 'Abrir Expositor de Campaña' : 'Volver al Mapa'}
              style={{ marginLeft:'auto', display:'flex', alignItems:'center', gap:5, background: appMode==='expositor' ? `${C.accent}22` : 'rgba(255,255,255,.05)', border:`1px solid ${appMode==='expositor' ? C.accent : C.border}`, borderRadius:5, padding:'3px 8px', cursor:'pointer', color: appMode==='expositor' ? C.accent : C.dim, fontSize:10, fontWeight:600, letterSpacing:'0.05em', transition:'all 0.2s' }}>
              <span style={{ fontSize:11 }}>🎴</span>
              {appMode === 'map' ? 'Expositor' : 'Mapa'}
            </button>
          </div>
          <div style={{ color:C.dim, fontSize:12 }}>Panel del Dungeon Master</div>
        </div>

        {/* Importar */}
        <div style={{ padding:'6px 12px 7px', borderBottom:`1px solid ${C.border}` }}>
          <div style={{ fontSize:10, fontWeight:600, color:C.dim, textTransform:'uppercase', letterSpacing:'0.1em', marginBottom:4 }}>Importar</div>
          <div style={{ display:'flex', gap:4 }}>
            <div style={{ flex:1, minWidth:0 }}><DropZone accept="image/*,video/*"
              label={bgLoaded ? bgName : 'Img/Vídeo'}
              sub={bgLoaded ? '✓ OK' : 'Clic o arrastre'}
              active={bgLoaded} color={bgLoaded ? C.ok : C.dim}
              onFile={loadBg} onDrop={e => onDrop(e,'bg')}/></div>
            <div style={{ flex:1, minWidth:0 }}><DropZone accept=".psd"
              label={parsing ? 'Procesando...' : struct ? 'PSD ✓' : 'PSD'}
              sub={psdInfo ? `${psdInfo.width}×${psdInfo.height}` : parseError ? 'Error' : 'Clic o arrastre'}
              active={!!struct} color={struct ? C.ok : parseError ? C.enemy : C.zone}
              onFile={loadPSD} onDrop={e => onDrop(e,'psd')} disabled={parsing}/></div>
          </div>
          {parsing && <div style={{ marginTop:6, color:C.dim, fontSize:11, textAlign:'center' }}>Extrayendo imágenes de capas...</div>}
          {parseError && (
            <div style={{ marginTop:5, padding:'6px 9px', borderRadius:6, background:'rgba(248,81,73,.1)', border:'1px solid rgba(248,81,73,.3)', color:'#ffa0a0', fontSize:12, lineHeight:1.5 }}>
              <AlertTriangle size={12} style={{ verticalAlign:'middle', marginRight:5 }}/>{parseError}
            </div>
          )}
          {warnings.length > 0 && !parseError && !warningsDismissed && (
            <div style={{ marginTop:5, padding:'5px 9px', borderRadius:5, background:'rgba(210,153,34,.08)', border:'1px solid rgba(210,153,34,.25)', color:C.warn, fontSize:11, lineHeight:1.6, position:'relative' }}>
              <button onClick={() => setWarningsDismissed(true)} title="Cerrar"
                style={{ position:'absolute', top:'50%', transform:'translateY(-50%)', right:4, background:'none', border:'none', cursor:'pointer', color:C.dim, fontSize:12, lineHeight:1, padding:0 }}>✕</button>
              {warnings.map((w,i) => <div key={i}>• {w}</div>)}
            </div>
          )}
        </div>

        {/* Tabs */}
        <div style={{ display:'flex', borderBottom:`1px solid ${C.border}`, flexShrink:0 }}>
          {[['mapa','Mapa'],['eines','Eines']].map(([t,label]) => (
            <button key={t} onClick={() => setSidebarTab(t)}
              style={{ flex:1, padding:'7px 4px', border:'none', borderBottom:`2px solid ${sidebarTab===t?C.accent:'transparent'}`, background:sidebarTab===t?`${C.accent}12`:'transparent', color:sidebarTab===t?C.accent:C.dim, fontSize:11, fontWeight:700, textTransform:'uppercase', letterSpacing:'0.08em', cursor:'pointer' }}>
              {label}
            </button>
          ))}
        </div>

        {/* Contingut de la pestanya activa */}
        <div style={{ flex:1, overflowY:'auto' }}>

          {/* ── TAB MAPA ── */}
          {sidebarTab === 'mapa' && (
            <>
              {!struct ? (
                <div style={{ padding:24, textAlign:'center', color:C.dim }}>
                  <Layers size={28} color={C.border} style={{ display:'block', margin:'0 auto 10px' }}/>
                  <div style={{ fontSize:12 }}>Importa un PSD para ver las capas</div>
                </div>
              ) : (
                <>
                  {struct.extras.children.length > 0 && (
                    <TreeGroup label="EXTRAS" color={C.extras} icon={<Shield size={11}/>} note="Fijo">
                      {struct.extras.children.map(l => <LayerRow key={l.id} layer={l} locked color={C.extras} onDelete={() => deleteLayer(l.id, 'extra')}/>)}
                    </TreeGroup>
                  )}
                  {struct.zonasLayers.length > 0 && (
                    <TreeGroup label="ZONAS" color={C.zone} icon={<MapPin size={11}/>} note="Overlays" defaultOpen={false}>
                      {struct.zonasLayers.map(l => <LayerRow key={l.id} layer={l} visible={!!vis[l.id]} onToggle={() => toggleVis(l.id)} color={C.zone} onDelete={() => deleteLayer(l.id, 'zone')}/>)}
                    </TreeGroup>
                  )}
                  {struct.enemyZones.map(zone => (
                    <div key={zone.id}>
                      <button onClick={() => toggleZone(zone.id)} style={{ width:'100%', display:'flex', alignItems:'center', gap:6, padding:'7px 14px', background:'rgba(248,81,73,.06)', border:'none', cursor:'pointer', color:C.text }}>
                        {expanded[zone.id] ? <ChevronDown size={12} color={C.dim}/> : <ChevronRight size={12} color={C.dim}/>}
                        <Skull size={11} color={C.enemy}/>
                        <span style={{ flex:1, fontWeight:600, color:C.enemy, fontSize:13, textAlign:'left' }}>{zone.name}</span>
                        <span style={{ fontSize:11, color:C.dim }}>{zone.enemies.filter(en=>vis[en.id]).length}/{zone.enemies.length}</span>
                      </button>
                      {expanded[zone.id] && (<>
                        {(zone.directEnemies || zone.enemies).map(en => (
                          <LayerRow key={en.id} layer={en} visible={!!vis[en.id]} onToggle={() => toggleVis(en.id)} color={C.enemy} indent draggable active={activeDrag===en.id} onReset={() => resetToken(en)} onDelete={() => deleteLayer(en.id, 'enemy')} selected={selectedToken===en.id} onSelect={() => { setSelectedToken(en.id); rSelectedToken.current=en.id; }}/>
                        ))}
                        {(zone.subGroups||[]).map(sg => (
                          <div key={sg.id}>
                            <button onClick={() => setExpanded(ex => ({...ex, [sg.id]: !ex[sg.id]}))}
                              style={{ width:'100%', display:'flex', alignItems:'center', gap:5, padding:'5px 14px 5px 28px', background:'rgba(248,81,73,.03)', border:'none', cursor:'pointer', color:C.dim }}>
                              {expanded[sg.id] ? <ChevronDown size={10} color={C.dim}/> : <ChevronRight size={10} color={C.dim}/>}
                              <span style={{ fontSize:11, color:C.dim, flex:1, textAlign:'left' }}>📁 {sg.name}</span>
                              <span style={{ fontSize:10, color:C.dim }}>{sg.enemies.filter(en=>vis[en.id]).length}/{sg.enemies.length}</span>
                            </button>
                            {expanded[sg.id] && sg.enemies.map(en => (
                              <LayerRow key={en.id} layer={en} visible={!!vis[en.id]} onToggle={() => toggleVis(en.id)} color={C.enemy} indent2 draggable active={activeDrag===en.id} onReset={() => resetToken(en)} onDelete={() => deleteLayer(en.id, 'enemy')} selected={selectedToken===en.id} onSelect={() => { setSelectedToken(en.id); rSelectedToken.current=en.id; }}/>
                            ))}
                          </div>
                        ))}
                      </>)}
                    </div>
                  ))}
                </>
              )}

              {/* Jugadors — 2 columnes compactes */}
              <div style={{ borderTop:`1px solid ${C.border}`, padding:'8px 10px' }}>
                <div style={{ display:'flex', alignItems:'center', gap:4, marginBottom:6 }}>
                  <span style={{ fontSize:10, fontWeight:700, color:C.dim, textTransform:'uppercase', letterSpacing:'0.1em', flex:1 }}>Jugadors</span>
                  <button onClick={loadParty} title="Carrega els 5 jugadors per defecte"
                    style={{ fontSize:9, padding:'2px 6px', borderRadius:3, border:`1px solid ${C.accent}`, background:`${C.accent}15`, cursor:'pointer', color:C.accent, fontWeight:700 }}>
                    Party
                  </button>
                </div>
                <div style={{ display:'flex', gap:3, alignItems:'center', marginBottom:4 }}>
                  <input value={newPName} onChange={e => setNewPName(e.target.value)}
                    onKeyDown={e => e.key==='Enter' && addPlayer()}
                    placeholder="Nom"
                    style={{ flex:1, minWidth:0, background:'#0d1117', border:`1px solid ${C.border}`, borderRadius:4, padding:'3px 6px', color:C.text, fontSize:11, outline:'none' }}/>
                  <input type="number" min={1} max={999} value={newPHpMax} onChange={e => setNewPHpMax(parseInt(e.target.value)||20)}
                    title="HP màxims"
                    style={{ width:36, background:'#0d1117', border:`1px solid ${C.border}`, borderRadius:4, padding:'3px 3px', color:'#56d364', fontSize:11, outline:'none', textAlign:'center' }}/>
                  <button onClick={addPlayer}
                    style={{ padding:'3px 5px', borderRadius:4, border:'none', background:C.accent, cursor:'pointer', color:'#0d1117', display:'flex', alignItems:'center', flexShrink:0 }}>
                    <UserPlus size={10}/>
                  </button>
                </div>
                <div style={{ display:'flex', flexWrap:'wrap', gap:3, marginBottom:6 }}>
                  {PALETTE.map(c => (
                    <div key={c} onClick={() => setNewPColor(c)}
                      style={{ width:14, height:14, borderRadius:'50%', background:c, cursor:'pointer', border:`2px solid ${newPColor===c?'#e6edf3':'transparent'}`, flexShrink:0 }}/>
                  ))}
                </div>
                <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:4 }}>
                  {players.map(pl => {
                    const hp = pl.hp ?? pl.hpMax;
                    const ratio = pl.hpMax > 0 ? Math.max(0, hp/pl.hpMax) : 1;
                    const hpCol = ratio > 0.5 ? '#56d364' : ratio > 0.25 ? '#e3b341' : '#f85149';
                    return (
                      <div key={pl.id} style={{ background:'rgba(255,255,255,0.04)', borderRadius:5, padding:'5px 6px', border:`1px solid rgba(255,255,255,0.07)` }}>
                        <div style={{ display:'flex', alignItems:'center', gap:4, marginBottom:3 }}>
                          <div style={{ width:10, height:10, borderRadius:'50%', background:pl.color, flexShrink:0 }}/>
                          <span style={{ flex:1, fontSize:11, color:C.text, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap', fontWeight:600 }}>{pl.name}</span>
                          <button onClick={() => removePlayer(pl.id)} style={{ background:'none', border:'none', cursor:'pointer', color:C.dim, padding:0, display:'flex', flexShrink:0 }}><X size={9}/></button>
                        </div>
                        <div style={{ display:'flex', alignItems:'center', gap:2 }}>
                          <button onClick={() => adjustPlayerHp(pl.id, -1)} onContextMenu={e=>{e.preventDefault();adjustPlayerHp(pl.id,-10);}}
                            title="-1 HP (clic dret -10)"
                            style={{ width:18, height:18, borderRadius:3, border:'1px solid rgba(248,81,73,0.4)', background:'rgba(248,81,73,0.1)', cursor:'pointer', color:'#f85149', fontSize:13, fontWeight:700, display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0 }}>−</button>
                          <span style={{ flex:1, textAlign:'center', fontSize:10, color:hpCol, fontWeight:700 }}>{hp}/{pl.hpMax}</span>
                          <button onClick={() => adjustPlayerHp(pl.id, 1)} onContextMenu={e=>{e.preventDefault();adjustPlayerHp(pl.id,10);}}
                            title="+1 HP (clic dret +10)"
                            style={{ width:18, height:18, borderRadius:3, border:'1px solid rgba(86,211,100,0.4)', background:'rgba(86,211,100,0.1)', cursor:'pointer', color:'#56d364', fontSize:13, fontWeight:700, display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0 }}>+</button>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            </>
          )}

          {/* ── TAB EINES ── */}
          {sidebarTab === 'eines' && (
            <>
              {/* Dibuix */}
              <div style={{ padding:'10px 12px' }}>
                <div style={{ fontSize:10, fontWeight:700, color:C.dim, textTransform:'uppercase', letterSpacing:'0.1em', marginBottom:6 }}>Dibuix</div>
                <div style={{ display:'flex', gap:3, alignItems:'center', marginBottom:5 }}>
                  {[['pen','1:Ploma',<PenLine size={11}/>],['eraser','2:Goma',<Eraser size={11}/>],['shape','3:Màgies',<svg width={11} height={11} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="12 2 19 21 5 21 12 2"/></svg>],['pointer','4:Senyal',<svg width={11} height={11} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3"/><line x1="12" y1="2" x2="12" y2="5"/><line x1="12" y1="19" x2="12" y2="22"/><line x1="2" y1="12" x2="5" y2="12"/><line x1="19" y1="12" x2="22" y2="12"/></svg>]].map(([t, label, icon]) => {
                    const isPtr = t === 'pointer';
                    const col = isPtr ? '#58a6ff' : drawColor;
                    return (
                      <button key={t} onClick={() => { setDrawTool(dt => { const nt=dt===t?'none':t; if(nt==='none'&&isPtr&&bcRef.current) bcRef.current.postMessage({type:'POINTER',pos:null}); return nt; }); }} title={label}
                        style={{ flex:1, display:'flex', alignItems:'center', justifyContent:'center', gap:2, padding:'5px 2px', borderRadius:5, border:`1px solid ${drawTool===t?col:C.border}`, background:drawTool===t?`${col}22`:'transparent', cursor:'pointer', color:drawTool===t?col:C.dim, fontSize:9, whiteSpace:'nowrap', overflow:'hidden' }}>
                        {icon} {label}
                      </button>
                    );
                  })}
                  <button onClick={undoStroke} disabled={!canUndo} title="Desfer (Ctrl+Z)"
                    style={{ padding:'5px 6px', borderRadius:5, border:`1px solid ${C.border}`, background:'transparent', cursor:canUndo?'pointer':'default', color:canUndo?C.dim:'rgba(139,148,158,0.25)', display:'flex', flexShrink:0 }}>
                    <RotateCcw size={11}/>
                  </button>
                  <button onClick={clearDrawing} title="Esborrar tot"
                    style={{ padding:'5px 6px', borderRadius:5, border:`1px solid ${C.border}`, background:'transparent', cursor:'pointer', color:C.dim, display:'flex', flexShrink:0 }}>
                    <Trash2 size={11}/>
                  </button>
                  {paintedZones.length > 0 && (
                    <button onClick={clearPaintedZones} title="Esborrar zones màgiques"
                      style={{ padding:'5px 5px', borderRadius:5, border:'1px solid rgba(168,85,247,0.4)', background:'rgba(168,85,247,0.08)', cursor:'pointer', color:'#a855f7', fontSize:9, display:'flex', alignItems:'center', flexShrink:0 }}>
                      ✨{paintedZones.length}
                    </button>
                  )}
                </div>
                <div style={{ display:'flex', alignItems:'center', gap:3, opacity:(drawTool==='pen'||drawTool==='eraser')?1:0.22, pointerEvents:(drawTool==='pen'||drawTool==='eraser')?'auto':'none', transition:'opacity 0.15s' }}>
                  {PALETTE.map(c => (
                    <div key={c} onClick={() => setDrawColor(c)} title={c}
                      style={{ width:14, height:14, borderRadius:'50%', background:c, cursor:'pointer', border:`2px solid ${drawColor===c?'#e6edf3':'transparent'}`, boxSizing:'border-box', flexShrink:0 }}/>
                  ))}
                  <input type="range" min={2} max={30} value={drawSize} onChange={e => setDrawSize(parseInt(e.target.value))}
                    style={{ flex:1, accentColor:drawColor, minWidth:0 }}/>
                  <span style={{ color:C.dim, fontSize:10, minWidth:22, flexShrink:0 }}>{drawSize}px</span>
                </div>
              </div>

              {/* Grid */}
              <div style={{ borderTop:`1px solid ${C.border}`, padding:'10px 12px' }}>
                <div style={{ display:'flex', alignItems:'center', gap:5, marginBottom: gridVisible ? 6 : 0 }}>
                  <div style={{ fontSize:10, fontWeight:700, color:C.dim, textTransform:'uppercase', letterSpacing:'0.1em', flex:1 }}>Grid</div>
                  <button onClick={() => { const nv=!gridVisible; setGridVisible(nv); rGridVisible.current=nv; if(nv&&!gridCalibrating){setGridCalibrating(true);rGridCalibrating.current=true;gridCalibRef.current=null;gridCalibCurrRef.current=null;} if(!nv){setGridCalibrating(false);rGridCalibrating.current=false;} _broadcastState({}); }}
                    style={{ padding:'3px 9px', borderRadius:5, border:`1px solid ${gridVisible?C.accent:C.border}`, background:gridVisible?`${C.accent}22`:'transparent', cursor:'pointer', color:gridVisible?C.accent:C.dim, fontSize:10, fontWeight:600 }}>
                    {gridVisible ? 'Desactivar' : 'Activar'}
                  </button>
                  <label style={{ display:'flex', alignItems:'center', gap:3, fontSize:10, color:C.dim, cursor:'pointer' }}>
                    <input type="checkbox" checked={gridSnap} onChange={e => { setGridSnap(e.target.checked); rGridSnap.current=e.target.checked; if(e.target.checked) snapAllTokens(); }} style={{ accentColor:C.accent }}/>
                    Snap
                  </label>
                  <label style={{ display:'flex', alignItems:'center', gap:3, fontSize:10, color:C.dim, cursor:'pointer' }} title="Ajusta tots els tokens al 90% de la cel·la del grid">
                    <input type="checkbox" checked={gridAutoSize} onChange={e => { setGridAutoSize(e.target.checked); rGridAutoSize.current=e.target.checked; if(e.target.checked) sizeAllTokens(); else { setTokenSizeOverride({}); rTokenSizeOverride.current={}; _broadcastState({ tokenSizeOverride:{} }); } }} style={{ accentColor:C.accent }}/>
                    Mida
                  </label>
                </div>
                {gridVisible && (
                  <div>
                    <div style={{ display:'flex', alignItems:'center', gap:5, marginBottom:6 }}>
                      <button
                        onClick={() => { setGridCalibrating(true); rGridCalibrating.current=true; gridCalibRef.current=null; gridCalibCurrRef.current=null; }}
                        title="Arrossega sobre el mapa per definir una cel·la del grid"
                        style={{ display:'flex', alignItems:'center', gap:4, padding:'4px 8px', borderRadius:5, border:`1px solid ${gridCalibrating?C.accent:C.border}`, background:gridCalibrating?`${C.accent}22`:'transparent', cursor:'pointer', color:gridCalibrating?C.accent:C.dim, fontSize:10 }}>
                        <svg width={10} height={10} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="3" y="3" width="18" height="18" rx="1"/><line x1="9" y1="3" x2="9" y2="21"/><line x1="15" y1="3" x2="15" y2="21"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/></svg>
                        {gridCalibrating ? 'Calibrant...' : 'Calibrar cel·la'}
                      </button>
                      <span style={{ color:C.dim, fontSize:10 }}>{gridSize}px</span>
                      {gridCalibrating && (
                        <button onClick={() => { setGridCalibrating(false); rGridCalibrating.current=false; gridCalibRef.current=null; gridCalibCurrRef.current=null; }}
                          style={{ marginLeft:'auto', padding:'3px 7px', borderRadius:4, border:'1px solid rgba(248,81,73,.4)', background:'transparent', cursor:'pointer', color:'#f85149', fontSize:10 }}>✕</button>
                      )}
                    </div>
                    <div style={{ display:'flex', gap:8 }}>
                      <div style={{ display:'flex', alignItems:'center', gap:3, flex:1 }}>
                        <span style={{ color:C.dim, fontSize:10, flexShrink:0 }}>Cel·la</span>
                        <button onClick={() => { const v=Math.max(1,gridSize-1); setGridSize(v); rGridSize.current=v; _broadcastState({}); }} style={{ width:20, height:20, borderRadius:4, border:`1px solid ${C.border}`, background:'rgba(255,255,255,.04)', cursor:'pointer', color:C.dim, display:'flex', alignItems:'center', justifyContent:'center', fontSize:13, fontWeight:700, flexShrink:0 }}>−</button>
                        <span style={{ color:C.text, fontSize:11, minWidth:32, textAlign:'center', flexShrink:0 }}>{gridSize}px</span>
                        <button onClick={() => { const v=Math.min(400,gridSize+1); setGridSize(v); rGridSize.current=v; _broadcastState({}); }} style={{ width:20, height:20, borderRadius:4, border:`1px solid ${C.border}`, background:'rgba(255,255,255,.04)', cursor:'pointer', color:C.dim, display:'flex', alignItems:'center', justifyContent:'center', fontSize:13, fontWeight:700, flexShrink:0 }}>+</button>
                      </div>
                      <div style={{ display:'flex', alignItems:'center', gap:3, flex:1 }}>
                        <span style={{ color:C.dim, fontSize:10, flexShrink:0 }}>Línia</span>
                        <button onClick={() => { const v=Math.max(0.5,+(gridLineWidth-0.1).toFixed(1)); setGridLineWidth(v); rGridLineWidth.current=v; _broadcastState({}); }} style={{ width:20, height:20, borderRadius:4, border:`1px solid ${C.border}`, background:'rgba(255,255,255,.04)', cursor:'pointer', color:C.dim, display:'flex', alignItems:'center', justifyContent:'center', fontSize:13, fontWeight:700, flexShrink:0 }}>−</button>
                        <span style={{ color:C.text, fontSize:11, minWidth:28, textAlign:'center', flexShrink:0 }}>{gridLineWidth}px</span>
                        <button onClick={() => { const v=Math.min(10,+(gridLineWidth+0.1).toFixed(1)); setGridLineWidth(v); rGridLineWidth.current=v; _broadcastState({}); }} style={{ width:20, height:20, borderRadius:4, border:`1px solid ${C.border}`, background:'rgba(255,255,255,.04)', cursor:'pointer', color:C.dim, display:'flex', alignItems:'center', justifyContent:'center', fontSize:13, fontWeight:700, flexShrink:0 }}>+</button>
                      </div>
                    </div>
                  </div>
                )}
              </div>
            </>
          )}

        </div>

        {/* Controles inferiores */}
        <div style={{ padding:'12px 14px', borderTop:`1px solid ${C.border}` }}>
          <button onClick={openPlayerWindow} style={{ width:'100%', display:'flex', alignItems:'center', justifyContent:'center', gap:8, padding:'9px', borderRadius:7, border:'none', cursor:'pointer', background:C.accent, color:'#0d1117', fontWeight:700, fontSize:12, marginBottom:8 }}>
            <Maximize2 size={14}/> Modo Jugador
          </button>
          <div style={{ display:'flex', gap:6, marginBottom:8 }}>
            <button onClick={saveSession} title="Guardar sesión en JSON" style={{ flex:1, display:'flex', alignItems:'center', justifyContent:'center', gap:5, padding:'6px', borderRadius:6, border:`1px solid ${C.border}`, background:'transparent', cursor:'pointer', color:C.dim, fontSize:10 }}>
              <svg width={11} height={11} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
              Guardar
            </button>
            <label title="Cargar sesión desde JSON" style={{ flex:1, display:'flex', alignItems:'center', justifyContent:'center', gap:5, padding:'6px', borderRadius:6, border:`1px solid ${C.border}`, background:'transparent', cursor:'pointer', color:C.dim, fontSize:10 }}>
              <input type="file" accept=".json" style={{ display:'none' }} onChange={e => { if(e.target.files[0]) { loadSession(e.target.files[0]); e.target.value=''; } }}/>
              <svg width={11} height={11} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
              Cargar
            </label>
          </div>
          <div style={{ display:'flex', alignItems:'center', gap:7, marginBottom:8 }}>
            <button onClick={() => setZoom(z => Math.max(.2,z-.1))} style={{ background:'none', border:`1px solid ${C.border}`, borderRadius:5, cursor:'pointer', color:C.dim, padding:'3px 6px', display:'flex' }}><ZoomOut size={11}/></button>
            <input type="range" min={0.2} max={4} step={0.05} value={zoom} onChange={e => setZoom(parseFloat(e.target.value))} style={{ flex:1, accentColor:C.accent }}/>
            <button onClick={() => setZoom(z => Math.min(3,z+.1))} style={{ background:'none', border:`1px solid ${C.border}`, borderRadius:5, cursor:'pointer', color:C.dim, padding:'3px 6px', display:'flex' }}><ZoomIn size={11}/></button>
            <span style={{ color:C.dim, fontSize:12, minWidth:34, textAlign:'right' }}>{Math.round(zoom*100)}%</span>
          </div>
          <div style={{ display:'flex', gap:6, flexWrap:'wrap' }}>
            {psdInfo && <Chip>{psdInfo.width}×{psdInfo.height}</Chip>}
            {struct && <Chip col={C.enemy}>{activeCount} activos</Chip>}
            {layerImagesCount > 0 && <Chip col={C.ok}>{layerImagesCount} imgs</Chip>}
          </div>
        </div>
      </div>

      {/* ══ ÁREA PRINCIPAL ══ */}
      <div style={{ flex:1, position:'relative', background:C.dark, overflow:'hidden' }}>
        <div ref={stageRef} style={{ position:'absolute', top:0, left:0, right:0, bottom:0, overflow:'hidden' }}/>
        <canvas ref={canvasRef}
          style={{ position:'absolute', top:0, left:0, right:0, bottom:0, width:'100%', height:'100%', background:'transparent',
            cursor: gridCalibrating ? 'crosshair' : activeDrag ? 'grabbing' : zoneDragRef.current ? 'move' : drawTool==='pen' ? 'crosshair' : drawTool==='eraser' ? 'cell' : drawTool==='shape' ? (ctrlHeld ? 'move' : 'crosshair') : drawTool==='pointer' ? 'crosshair' : 'default' }}
          onMouseDown={onMouseDown} onMouseMove={onMouseMove} onMouseUp={onMouseUp} onMouseLeave={onMouseLeaveCanvas}
          onContextMenu={onContextMenu}/>

        {/* Hint de calibración del grid */}
        {gridCalibrating && (
          <div style={{ position:'absolute', top:50, left:'50%', transform:'translateX(-50%)', zIndex:20, pointerEvents:'none', background:'rgba(10,13,18,0.90)', border:`1px solid ${C.accent}`, borderRadius:7, padding:'6px 14px', fontSize:11, color:C.accent, fontWeight:600, letterSpacing:'0.04em', whiteSpace:'nowrap', boxShadow:`0 0 12px ${C.accent}44` }}>
            🎯 Arrastra sobre el mapa para definir una celda del grid
          </div>
        )}

        {/* HUD DM — centrado en el canvas */}
        <div style={{ position:'absolute', top:12, left:'50%', transform:'translateX(-50%)', display:'flex', gap:6, alignItems:'center', pointerEvents:'auto' }}>
          {/* Vista privada DM activa */}
          {dmPrivateActive && (
            <button
              onClick={() => { dmLocalPan.current={x:0,y:0}; dmLocalZoom.current=1; setDmPrivateActive(false); }}
              title="Vista privada DM activa — pulsa para volver a la vista compartida"
              style={{ background:'rgba(88,166,255,.18)', border:'1px solid #58a6ff', borderRadius:6, padding:'5px 9px', cursor:'pointer', color:'#58a6ff', display:'flex', alignItems:'center', gap:5, fontSize:10, fontWeight:600, animation:'pulse 1.5s infinite' }}
            >
              <Eye size={11}/> Vista DM
            </button>
          )}
          {/* Botón candado — solo visible si hay zonas invisibles */}
          {struct && struct.zonasLayers.some(l => !vis[l.id]) && (
            <button
              onClick={() => setZonesLocked(v => !v)}
              title={zonesLocked ? 'Zonas bloqueadas — pulsa o mantén Ctrl para reactivarlas' : 'Modo desbloqueado — puedes reactivar zonas invisibles'}
              style={{
                background: zonesLocked ? 'rgba(10,13,18,.92)' : 'rgba(212,160,23,.18)',
                border: `1px solid ${zonesLocked ? C.border : C.accent}`,
                borderRadius:6, padding:'5px 8px', cursor:'pointer',
                color: zonesLocked ? C.dim : C.accent,
                display:'flex', alignItems:'center', gap:5,
                boxShadow: zonesLocked ? 'none' : `0 0 8px ${C.accent}55`,
                transition:'all 0.2s',
              }}
            >
              {zonesLocked ? <LockIcon size={11}/> : <UnlockIcon size={11}/>}
              <span style={{ fontSize:10, fontWeight:600, letterSpacing:'0.05em' }}>
                {zonesLocked ? 'Zonas' : 'Desbloqueo'}
              </span>
            </button>
          )}
          <div style={{ background:'rgba(10,13,18,.92)', border:`1px solid ${C.border}`, borderRadius:6, padding:'5px 11px', fontSize:11, color:C.dim }}>
            <span style={{ color:C.accent, fontWeight:700 }}>DM</span>
          </div>
          <button onClick={() => { setZoom(1); rZoom.current=1; rPanOffset.current={x:0,y:0}; dmLocalPan.current={x:0,y:0}; dmLocalZoom.current=1; dmPrivateReturnAnim.current=false; setDmPrivateActive(false); _broadcastState({}); }} title="Reset zoom y posición" style={{ background:'rgba(10,13,18,.92)', border:`1px solid ${C.border}`, borderRadius:6, padding:'5px 7px', cursor:'pointer', color:C.dim, display:'flex' }}>
            <RotateCcw size={11}/>
          </button>
          {struct && (
            <div style={{ display:'flex', alignItems:'center', gap:2 }}>
              <button
                onClick={() => { const nh=!enemyHighlight; setEnemyHighlight(nh); rEnemyHighlight.current=nh; if(!nh) rHighlightAlpha.current=0; _broadcastState({}); }}
                title={`Resaltar enemigos${highlightLocked ? ' (bloqueado ∞)' : ' (3.5s)'}`}
                style={{ background: enemyHighlight ? 'rgba(255,210,0,.18)' : 'rgba(10,13,18,.92)', border: enemyHighlight ? '1px solid #ffd200' : `1px solid ${C.border}`, borderRadius:'6px 0 0 6px', padding:'5px 8px', cursor:'pointer', color: enemyHighlight ? '#ffd200' : C.dim, display:'flex', alignItems:'center', gap:4, boxShadow: enemyHighlight ? '0 0 10px rgba(255,210,0,.25)' : 'none', transition:'all 0.2s' }}
              >
                <svg width={11} height={11} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="4"/></svg>
                <span style={{ fontSize:10, fontWeight:600, letterSpacing:'0.04em' }}>Resaltar</span>
              </button>
              <button
                onClick={() => { const nl=!highlightLocked; setHighlightLocked(nl); rHighlightLocked.current=nl; }}
                title={highlightLocked ? 'Bloqueado: resaltado permanente — pulsa para usar timer' : 'Timer 3.5s — pulsa para bloquear permanente'}
                style={{ background: highlightLocked ? 'rgba(255,210,0,.18)' : 'rgba(10,13,18,.92)', border: highlightLocked ? '1px solid #ffd200' : `1px solid ${C.border}`, borderLeft:'none', borderRadius:'0 6px 6px 0', padding:'5px 6px', cursor:'pointer', color: highlightLocked ? '#ffd200' : C.dim, display:'flex', alignItems:'center', transition:'all 0.2s' }}
              >
                {highlightLocked ? <LockIcon size={10}/> : <UnlockIcon size={10}/>}
              </button>
            </div>
          )}
        </div>

        {/* Botón "Volver al Mapa" — flota encima del iframe del Expositor (solo DM) */}
        {appMode === 'expositor' && !isPlayerWindow && (
          <button
            onClick={() => setAppMode('map')}
            style={{ position:'fixed', top:14, left:14, zIndex:600, display:'flex', alignItems:'center', gap:6,
              background:'rgba(10,13,18,.92)', border:`1px solid ${C.border}`, borderRadius:7,
              padding:'7px 13px', cursor:'pointer', color:C.text, fontSize:12, fontWeight:600,
              boxShadow:'0 4px 16px rgba(0,0,0,.6)', backdropFilter:'blur(10px)',
              transition:'all 0.15s' }}
            onMouseEnter={e => e.currentTarget.style.borderColor = C.accent}
            onMouseLeave={e => e.currentTarget.style.borderColor = C.border}
          >
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
              <polyline points="15 18 9 12 15 6"/>
            </svg>
            Mapa
          </button>
        )}

        {/* Pantalla bienvenida */}
        {!bgLoaded && (
          <div style={{ position:'absolute', inset:0, display:'flex', alignItems:'center', justifyContent:'center', pointerEvents:'none' }}>
            <div style={{ textAlign:'center', color:C.dim, maxWidth:380, padding:20 }}>
              <div style={{ fontSize:44, marginBottom:14 }}>⚔️</div>
              <div style={{ fontSize:20, color:C.bright, fontWeight:600, marginBottom:8 }}>RPG Map Viewer v2.16</div>
              <div style={{ fontSize:13, lineHeight:1.8 }}>Importa una imagen o video como fondo del mapa, luego añade el archivo PSD para gestionar capas y tokens de enemigos.</div>
            </div>
          </div>
        )}
      </div>
    </div>

    {/* ══ MENÚ RADIAL DE ELEMENTOS (forma cerrada) ══ */}
    {/* Menú de hechizo — círculos igual que el picker de zonas */}
    {spellMenu && !isPlayerWindow && (
      <div onMouseDown={e=>e.stopPropagation()} style={{ position:'fixed', inset:0, zIndex:9998 }} onClick={()=>setSpellMenu(null)}>
        {/* Label central */}
        <div style={{ position:'fixed', left:spellMenu.cx, top:spellMenu.cy, transform:'translate(-50%,-50%)', background:'rgba(10,13,18,0.92)', border:`1px solid ${C.border}`, borderRadius:20, padding:'4px 10px', color:C.dim, fontSize:10, whiteSpace:'nowrap', pointerEvents:'none', zIndex:2 }}>Elige hechizo</div>
        {[
          { type:'fireball',   emoji:'🔥', color:'#ff8800', title:'Bola de fuego' },
          { type:'lightning',  emoji:'⚡', color:'#ffd200', title:'Rayo eléctrico' },
          { type:'magic_beam', emoji:'✨', color:'#9988ff', title:'Rayo mágico' },
        ].map(({ type, emoji, color, title }, i, arr) => {
          const angle = (i / arr.length) * Math.PI * 2 - Math.PI/2;
          const R2 = 68;
          return (
            <div key={type} title={title}
              onMouseDown={e => { e.stopPropagation(); addSpell(type); }}
              style={{ position:'fixed',
                left: spellMenu.cx + Math.cos(angle)*R2 - 18,
                top:  spellMenu.cy + Math.sin(angle)*R2 - 18,
                width:36, height:36, borderRadius:'50%',
                border:`2px solid ${color}`,
                background:`${color}22`,
                cursor:'pointer', boxShadow:`0 0 8px ${color}88`,
                display:'flex', alignItems:'center', justifyContent:'center',
                fontSize:17, userSelect:'none', pointerEvents:'auto' }}>
              {emoji}
            </div>
          );
        })}
      </div>
    )}

    {shapeMenu && !isPlayerWindow && (
      <div onMouseDown={e=>e.stopPropagation()} style={{ position:'fixed', inset:0, zIndex:9998 }} onClick={()=>setShapeMenu(null)}>
        <div style={{ position:'absolute', left:shapeMenu.cx, top:shapeMenu.cy, transform:'translate(-50%,-50%)' }}>
          {/* Central label */}
          <div style={{ position:'absolute', left:'50%', top:'50%', transform:'translate(-50%,-50%)', background:'rgba(10,13,18,0.92)', border:`1px solid ${C.border}`, borderRadius:20, padding:'4px 10px', color:C.dim, fontSize:10, whiteSpace:'nowrap', pointerEvents:'none', zIndex:2 }}>
            Elige elemento
          </div>
          {ELEMENTS.map((el, i) => {
            const angle = (i / ELEMENTS.length) * Math.PI * 2 - Math.PI / 2;
            const R = 68;
            const x = Math.cos(angle) * R, y = Math.sin(angle) * R;
            return (
              <button key={el.id}
                onClick={e => { e.stopPropagation(); addPaintedZone(el.id); }}
                style={{
                  position:'absolute', left:x, top:y, transform:'translate(-50%,-50%)',
                  width:50, height:50, borderRadius:'50%',
                  background:`radial-gradient(circle at 35% 35%, ${el.color}ee, ${el.glow}99)`,
                  border:`2px solid ${el.color}`,
                  boxShadow:`0 0 14px ${el.color}88, 0 2px 8px rgba(0,0,0,0.6)`,
                  cursor:'pointer', display:'flex', flexDirection:'column',
                  alignItems:'center', justifyContent:'center', gap:1,
                  transition:'transform 0.15s, box-shadow 0.15s',
                }}
                onMouseEnter={e => { e.currentTarget.style.transform='translate(-50%,-50%) scale(1.2)'; e.currentTarget.style.boxShadow=`0 0 24px ${el.color}, 0 4px 12px rgba(0,0,0,0.7)`; }}
                onMouseLeave={e => { e.currentTarget.style.transform='translate(-50%,-50%) scale(1)';   e.currentTarget.style.boxShadow=`0 0 14px ${el.color}88, 0 2px 8px rgba(0,0,0,0.6)`; }}
              >
                <span style={{ fontSize:18, lineHeight:1 }}>{el.emoji}</span>
                <span style={{ fontSize:8, color:'#fff', fontWeight:700, textShadow:'0 1px 2px rgba(0,0,0,0.8)' }}>{el.label}</span>
              </button>
            );
          })}
          {/* Cancel */}
          <button onClick={e=>{e.stopPropagation();setShapeMenu(null);}}
            style={{ position:'absolute', left:0, top:0, transform:'translate(-50%,-50%)', width:32, height:32, borderRadius:'50%', background:'rgba(30,30,30,0.9)', border:`1px solid ${C.border}`, cursor:'pointer', color:C.dim, fontSize:14, display:'flex', alignItems:'center', justifyContent:'center', zIndex:3 }}>
            ✕
          </button>
        </div>
      </div>
    )}

    {/* ══ CONTEXT MENU (condiciones + zona pintada) ══ */}
    {contextMenu && !isPlayerWindow && (
      <div data-ctxmenu="1" style={{
        position:'fixed', left: Math.min(contextMenu.x, window.innerWidth-230), top: Math.min(contextMenu.y, window.innerHeight-420),
        background:C.panel, border:`1px solid ${C.border}`, borderRadius:10, zIndex:9999,
        boxShadow:'0 8px 32px rgba(0,0,0,0.65)', minWidth:220, overflow:'hidden',
      }}>
        <div style={{ padding:'8px 12px 6px', borderBottom:`1px solid ${C.border}`, display:'flex', alignItems:'center', justifyContent:'space-between' }}>
          <span style={{ color:C.bright, fontWeight:700, fontSize:12 }}>{contextMenu.name}</span>
          <div style={{ display:'flex', alignItems:'center', gap:6 }}>
            {!contextMenu.isPaintedZone && (
              <button
                onMouseDown={e => { e.stopPropagation();
                  { const nd = {...rDefeated.current}; if (nd[contextMenu.id]) delete nd[contextMenu.id]; else nd[contextMenu.id] = true;
                    rDefeated.current = nd; if (!nd[contextMenu.id]) delete defeatedAnimRef.current[contextMenu.id];
                    else defeatedAnimRef.current[contextMenu.id] = 0;
                    setDefeated({...nd}); _broadcastState({}); }
                }}
                title={defeated[contextMenu.id] ? 'Marcar como vivo' : 'Marcar como derrotado'}
                style={{ background: defeated[contextMenu.id] ? 'rgba(239,68,68,.25)' : 'rgba(239,68,68,.08)', border:`1px solid ${defeated[contextMenu.id] ? '#ef4444' : 'rgba(239,68,68,.3)'}`, borderRadius:4, padding:'2px 7px', cursor:'pointer', color: defeated[contextMenu.id] ? '#ef4444' : '#f87171', fontSize:10, fontWeight:700 }}>
                {defeated[contextMenu.id] ? '✕ Derrotado' : '✕'}
              </button>
            )}
            <span style={{ color:C.dim, fontSize:10 }}>{contextMenu.isPaintedZone ? 'Zona mágica' : 'Estados'}</span>
          </div>
        </div>
        {contextMenu.isPaintedZone ? (
          <div style={{ padding:8 }}>
            <button onMouseDown={e=>{e.stopPropagation(); deletePaintedZone(contextMenu.id); setContextMenu(null);}}
              style={{ width:'100%', padding:'7px', background:'rgba(248,81,73,.12)', border:'1px solid rgba(248,81,73,.3)', borderRadius:6, color:'#f85149', cursor:'pointer', fontSize:12 }}>
              🗑 Eliminar zona
            </button>
          </div>
        ) : (<>
          <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:2, padding:6, maxHeight:360, overflowY:'auto' }}>
            {CONDITIONS.map(cond => {
              const active = (conditions[contextMenu.id] || []).includes(cond.id);
              return (
                <button key={cond.id}
                  onMouseDown={e => { e.stopPropagation(); toggleCondition(contextMenu.id, cond.id); }}
                  style={{ display:'flex', alignItems:'center', gap:7, padding:'6px 8px', border: active ? `1px solid ${cond.bg}66` : '1px solid transparent', borderRadius:6, cursor:'pointer', background: active ? `${cond.bg}22` : 'transparent', color: active ? '#e6edf3' : C.dim, fontSize:11, textAlign:'left' }}>
                  <div style={{ width:13, height:13, borderRadius:'50%', background:cond.bg, flexShrink:0, opacity: active ? 1 : 0.5 }}/>
                  {cond.label}
                  {active && <span style={{ marginLeft:'auto', color:cond.bg, fontSize:9 }}>●</span>}
                </button>
              );
            })}
          </div>
          {(conditions[contextMenu.id] || []).length > 0 && (
            <div style={{ borderTop:`1px solid ${C.border}`, padding:'4px 6px' }}>
              <button onMouseDown={e => { e.stopPropagation(); const ncClr={...rConditions.current}; delete ncClr[contextMenu.id]; rConditions.current=ncClr; setConditions({...ncClr}); _broadcastState({}); }}
                style={{ width:'100%', padding:'5px', background:'rgba(248,81,73,.12)', border:'1px solid rgba(248,81,73,.3)', borderRadius:5, color:'#f85149', cursor:'pointer', fontSize:11 }}>
                Limpiar estados
              </button>
            </div>
          )}
          <div style={{ borderTop:`1px solid ${C.border}`, padding:'4px 6px' }}>
            <button onMouseDown={e => { e.stopPropagation(); setSceneConfigMenu({id:contextMenu.id, name:contextMenu.name, tokenPos:rPos.current[contextMenu.id], menuX:contextMenu.x, menuY:contextMenu.y}); setContextMenu(null); }}
              style={{ width:'100%', padding:'6px', background:'rgba(168,85,247,.12)', border:'1px solid rgba(168,85,247,.35)', borderRadius:5, color:'#c084fc', cursor:'pointer', fontSize:11, fontWeight:600 }}>
              ⚡ Escena
            </button>
          </div>
        </>)}
      </div>
    )}

    {/* ══ SCENE CONFIG MENU ══ */}
    {sceneConfigMenu && !isPlayerWindow && (
      <div data-ctxmenu="1" style={{
        position:'fixed', left:Math.min(sceneConfigMenu.menuX, window.innerWidth-250), top:Math.min(sceneConfigMenu.menuY, window.innerHeight-220),
        background:C.panel, border:`1px solid rgba(168,85,247,.45)`, borderRadius:10, zIndex:9999,
        boxShadow:'0 8px 32px rgba(0,0,0,0.7)', width:240, overflow:'hidden',
      }}>
        <div style={{ padding:'8px 12px 6px', borderBottom:`1px solid ${C.border}`, display:'flex', alignItems:'center', justifyContent:'space-between' }}>
          <span style={{ color:'#c084fc', fontWeight:700, fontSize:12 }}>⚡ {sceneConfigMenu.name}</span>
          <button onMouseDown={e=>{e.stopPropagation(); setSceneConfigMenu(null);}}
            style={{ background:'none', border:'none', cursor:'pointer', color:C.dim, padding:'2px', display:'flex', alignItems:'center' }}>
            <X size={12}/>
          </button>
        </div>
        <div style={{ padding:10, display:'flex', flexDirection:'column', gap:8 }}>
          <SceneImgPicker
            defaultCanvas={rLayerImages.current[sceneConfigMenu.id] || null}
            onTrigger={(imgEl) => {
              const tp = sceneConfigMenu.tokenPos;
              triggerBossIntro({ tokenId:sceneConfigMenu.id, bossName:sceneConfigMenu.name, portrait:imgEl, tokenPos:tp });
              // Encode portrait as JPEG data URL (max 600px) for player sync
              let portraitDataUrl = null;
              if (imgEl) {
                try {
                  const tmp = document.createElement('canvas');
                  const maxW = 600;
                  const srcW = imgEl.width || imgEl.naturalWidth || maxW;
                  const srcH = imgEl.height || imgEl.naturalHeight || maxW;
                  const sc = Math.min(1, maxW / Math.max(srcW, 1));
                  tmp.width = Math.round(srcW * sc); tmp.height = Math.round(srcH * sc);
                  tmp.getContext('2d').drawImage(imgEl, 0, 0, tmp.width, tmp.height);
                  portraitDataUrl = tmp.toDataURL('image/jpeg', 0.88);
                } catch(e) {}
              }
              bcRef.current?.postMessage({ type:'BOSS_INTRO', tokenId:sceneConfigMenu.id, bossName:sceneConfigMenu.name, tokenPos:tp, portraitDataUrl });
              setSceneConfigMenu(null);
            }}
            onCancel={() => setSceneConfigMenu(null)}
          />
        </div>
      </div>
    )}
  </>
  );
}

function SceneImgPicker({ defaultCanvas, onTrigger, onCancel }) {
  const [custom, setCustom] = React.useState(null); // { url, imgEl }
  const defaultUrl = React.useMemo(() => defaultCanvas ? defaultCanvas.toDataURL() : null, [defaultCanvas]);
  const previewUrl = custom?.url || defaultUrl;
  const imgEl      = custom?.imgEl || defaultCanvas;

  const handleFile = (file) => {
    if (!file || !file.type.startsWith('image/')) return;
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => setCustom({ url, imgEl: img });
    img.src = url;
  };

  return (
    <>
      <label style={{ display:'flex', alignItems:'center', gap:8, padding:'7px 10px', border:'1px dashed rgba(168,85,247,.4)', borderRadius:6, cursor:'pointer', background:'rgba(168,85,247,.06)' }}
        onDragOver={e=>e.preventDefault()}
        onDrop={e=>{ e.preventDefault(); handleFile(e.dataTransfer.files[0]); }}>
        <input type="file" accept="image/*" style={{ display:'none' }} onChange={e => e.target.files[0] && handleFile(e.target.files[0])} />
        {previewUrl
          ? <img src={previewUrl} style={{ width:44, height:44, objectFit:'cover', borderRadius:4, flexShrink:0 }} />
          : <Upload size={14} color="rgba(168,85,247,.7)" />}
        <span style={{ color:'rgba(168,85,247,.85)', fontSize:11, lineHeight:1.3 }}>
          {custom ? 'Canviar imatge' : defaultCanvas ? 'Imatge del token\n(clic per canviar)' : 'Importar imatge'}
        </span>
      </label>
      <button onMouseDown={e => { e.stopPropagation(); onTrigger(imgEl); }}
        style={{ width:'100%', padding:'8px', background:'rgba(168,85,247,.18)', border:'1px solid rgba(168,85,247,.55)', borderRadius:6, color:'#c084fc', cursor:'pointer', fontSize:12, fontWeight:700 }}>
        ⚡ Llançar escena
      </button>
    </>
  );
}

function DropZone({ accept, label, sub, active, color, onFile, onDrop, disabled }) {
  return (
    <label style={{ display:'flex', alignItems:'center', gap:7, padding:'5px 8px', borderRadius:5, cursor:disabled?'wait':'pointer', border:`1px dashed ${active?color:C.border}`, background:active?`${color}10`:'transparent', width:'100%', boxSizing:'border-box' }}
      onDrop={onDrop} onDragOver={e => e.preventDefault()}>
      <input type="file" accept={accept} style={{ display:'none' }} disabled={disabled} onChange={e => e.target.files[0] && onFile(e.target.files[0])}/>
      <Upload size={12} color={active?color:C.dim}/>
      <div style={{ minWidth:0, flex:1 }}>
        <div style={{ color:active?color:C.dim, fontWeight:500, fontSize:11, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>{label}</div>
        <div style={{ color:C.dim, fontSize:9, marginTop:1 }}>{sub}</div>
      </div>
    </label>
  );
}

function TreeGroup({ label, color, icon, note, children, defaultOpen=true }) {
  const [open, setOpen] = useState(defaultOpen);
  return (
    <div>
      <button onClick={() => setOpen(o=>!o)} style={{ width:'100%', display:'flex', alignItems:'center', gap:6, padding:'7px 14px', background:`${color}0e`, border:'none', cursor:'pointer', color:C.text }}>
        {open ? <ChevronDown size={12} color={C.dim}/> : <ChevronRight size={12} color={C.dim}/>}
        {icon}
        <span style={{ flex:1, fontWeight:700, color, fontSize:12, textAlign:'left' }}>{label}</span>
        {note && <span style={{ fontSize:10, color:C.dim }}>{note}</span>}
      </button>
      {open && <div>{children}</div>}
    </div>
  );
}

function LayerRow({ layer, visible, onToggle, locked, color, indent, indent2, draggable: isDrag, active, onReset, onDelete, onSelect, selected }) {
  const [hover, setHover] = useState(false);
  const pl = indent2 ? 44 : indent ? 28 : 20;
  return (
    <div style={{ display:'flex', alignItems:'center', gap:5, paddingLeft:pl, paddingRight:8, paddingTop:4, paddingBottom:4, background:selected?'rgba(100,210,255,.10)':active?'rgba(248,81,73,.07)':hover?'rgba(255,255,255,.025)':'transparent', opacity:!locked&&visible===false?0.4:1, cursor:onSelect?'pointer':'default' }}
      onClick={onSelect} onMouseEnter={() => setHover(true)} onMouseLeave={() => setHover(false)}>
      {locked
        ? <Shield size={11} color={C.dim}/>
        : <button onClick={onToggle} style={{ background:'none', border:'none', padding:2, cursor:'pointer', color:visible?color:C.dim, display:'flex', flexShrink:0 }}>{visible ? <Eye size={12}/> : <EyeOff size={12}/>}</button>
      }
      {isDrag && <Move size={10} color={active?C.enemy:C.dim} style={{ flexShrink:0 }}/>}
      <span style={{ flex:1, fontSize:13, color:C.text, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>{layer.name}</span>
      {onReset && hover && (
        <button onClick={onReset} title="Reset posición" style={{ background:'none', border:'none', cursor:'pointer', color:C.dim, padding:1, display:'flex', flexShrink:0 }}><RotateCcw size={10}/></button>
      )}
      {onDelete && hover && (
        <button onClick={e => { e.stopPropagation(); onDelete(); }} title="Eliminar capa"
          style={{ background:'none', border:'none', cursor:'pointer', color:'rgba(248,81,73,0.6)', padding:1, display:'flex', flexShrink:0 }}>
          <Trash2 size={10}/>
        </button>
      )}
    </div>
  );
}

function Chip({ children, col }) {
  const color = col || C.dim;
  return <span style={{ fontSize:11, color, background:`${color}18`, border:`1px solid ${color}33`, borderRadius:4, padding:'2px 7px' }}>{children}</span>;
}
