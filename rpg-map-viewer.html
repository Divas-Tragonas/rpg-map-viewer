// ══════════════════════════════════════════════════════════════════════════
// PSD STRUCTURE PARSER + IMAGE EXTRACTOR
// ══════════════════════════════════════════════════════════════════════════

// PackBits RLE decompressor
function unpackBits(src, unpacked) {
  let i = 0, j = 0;
  while (i < src.length && j < unpacked.length) {
    const n = src[i++];
    if (n === 128) continue;
    if (n < 128) {
      // literal run: copy next n+1 bytes
      const count = n + 1;
      for (let k = 0; k < count && i < src.length && j < unpacked.length; k++) {
        unpacked[j++] = src[i++];
      }
    } else {
      // repeat run: repeat next byte (256-n+1) times
      const count = 256 - n + 1;
      const val = src[i++];
      for (let k = 0; k < count && j < unpacked.length; k++) {
        unpacked[j++] = val;
      }
    }
  }
}

function parsePSDStructure(buffer) {
  const result = { width: 0, height: 0, bitDepth: 8, layers: [], channelDataOffset: 0, error: null };
  try {
    const dv = new DataView(buffer);
    const BL = buffer.byteLength;
    let p = 0;

    const u8  = () => p < BL     ? dv.getUint8(p++)          : (p++, 0);
    const u16 = () => p+2 <= BL  ? (p += 2, dv.getUint16(p-2)) : (p += 2, 0);
    const s16 = () => p+2 <= BL  ? (p += 2, dv.getInt16(p-2))  : (p += 2, 0);
    const u32 = () => p+4 <= BL  ? (p += 4, dv.getUint32(p-4)) : (p += 4, 0);
    const s32 = () => p+4 <= BL  ? (p += 4, dv.getInt32(p-4))  : (p += 4, 0);
    const sk  = n => { p = Math.min(p + Math.max(0, n), BL); };
    const str = n => { let s = ''; for (let i = 0; i < n; i++) s += String.fromCharCode(u8()); return s; };
    const pas = () => { const len = u8(), s = str(Math.min(len, BL-p)); sk(((len+1+3)&~3)-(len+1)); return s; };
    const uni = () => { const c = u32(); let s = ''; for (let i = 0; i < c && p+2 <= BL; i++) s += String.fromCharCode(u16()); return s; };

    if (str(4) !== '8BPS') { result.error = 'No es un archivo PSD válido'; return result; }
    if (u16() !== 1)        { result.error = 'Formato PSB no soportado. Guarda como PSD normal.'; return result; }
    sk(6); u16();
    result.height = u32(); result.width = u32();
    result.bitDepth = u16();
    if (u16() !== 3) { result.error = 'Solo soporta modo RGB. Ve a Imagen > Modo > Color RGB.'; return result; }

    sk(u32()); // color mode data
    sk(u32()); // image resources

    const lmLen = u32(); if (lmLen === 0) return result;
    const lmEnd = Math.min(p + lmLen, BL);
    const liLen = u32(); if (liLen === 0) { p = lmEnd; return result; }
    const liEnd = Math.min(p + liLen, lmEnd);

    let cnt = s16(); if (cnt < 0) cnt = -cnt;
    if (cnt > 5000) { result.error = `Demasiadas capas: ${cnt}`; return result; }

    for (let li = 0; li < cnt && p < liEnd - 8; li++) {
      const top = s32(), left = s32(), bottom = s32(), right = s32();
      const nch = Math.min(u16(), 64);
      // Read channel info: id (int16) + length (uint32) = 6 bytes each
      const channelInfo = [];
      for (let ci = 0; ci < nch; ci++) {
        const chId  = s16();
        const chLen = u32();
        channelInfo.push({ id: chId, len: chLen });
      }
      str(4); str(4); // blend sig + mode
      const opacity = u8(); u8();
      const flags = u8(); const visible = !(flags & 2);
      sk(1);

      const xLen = u32();
      const xEnd = Math.min(p + xLen, liEnd, BL);
      sk(Math.min(u32(), xEnd - p)); // mask data
      sk(Math.min(u32(), xEnd - p)); // blend ranges
      let name = pas();
      let secType = 0, uniName = null;

      while (p + 12 <= xEnd) {
        const sig = str(4);
        if (sig !== '8BIM' && sig !== '8B64') { p = xEnd; break; }
        const key = str(4), bLen = u32();
        const bEnd = Math.min(p + ((bLen + 1) & ~1), xEnd, BL);
        if (bEnd <= p) { p = xEnd; break; }
        try {
          if ((key === 'lsct' || key === 'lsdk') && p+4 <= bEnd) secType = u32();
          else if (key === 'luni' && p < bEnd) uniName = uni();
        } catch {}
        p = bEnd;
      }
      p = xEnd;

      result.layers.push({
        id: li, name: uniName || name, top, left, bottom, right,
        w: Math.max(0, right-left), h: Math.max(0, bottom-top),
        visible, opacity, secType, channelInfo
      });
    }

    // Channel image data starts right after all layer records
    result.channelDataOffset = p;

  } catch (err) {
    result.error = result.layers.length > 0
      ? `Lectura parcial (${result.layers.length} capas): ${err.message}`
      : err.message;
  }
  return result;
}

// Extract pixel images for specific layer IDs
async function extractLayerImages(buffer, parsedResult, targetLayerIds) {
  const { layers, channelDataOffset, bitDepth, width: docW, height: docH } = parsedResult;
  if (!channelDataOffset || channelDataOffset <= 0 || layers.length === 0) return {};
  const targetSet = new Set(targetLayerIds);
  const results = {};

  const BL = buffer.byteLength;
  const bytes = new Uint8Array(buffer);
  let p = channelDataOffset;

  for (const layer of layers) {
    const lw = layer.w, lh = layer.h;
    const isTarget = targetSet.has(layer.id);
    const chInfos = layer.channelInfo || [];

    // Determine decoded channel data for target layers
    const decoded = isTarget ? {} : null;

    for (const ch of chInfos) {
      const chEnd = Math.min(p + ch.len, BL);
      if (p + 2 > BL) { p = chEnd; continue; }

      const compression = (bytes[p] << 8) | bytes[p+1];
      p += 2;

      if (isTarget && lw > 0 && lh > 0) {
        const pixelCount = lw * lh;
        const unpacked = new Uint8Array(pixelCount);

        if (compression === 0) {
          // Raw
          const raw = bytes.subarray(p, Math.min(p + pixelCount * (bitDepth === 16 ? 2 : 1), chEnd));
          if (bitDepth === 16) {
            for (let i = 0; i < pixelCount && i*2+1 < raw.length; i++) {
              unpacked[i] = raw[i*2]; // take high byte
            }
          } else {
            unpacked.set(raw.subarray(0, pixelCount));
          }
        } else if (compression === 1) {
          // PackBits RLE — row byte counts first, then data
          const rowCounts = [];
          let totalComp = 0;
          for (let r = 0; r < lh && p + 2 <= chEnd; r++) {
            const rc = (bytes[p] << 8) | bytes[p+1]; p += 2;
            rowCounts.push(rc); totalComp += rc;
          }
          // Decompress row by row
          let outOff = 0;
          for (let r = 0; r < rowCounts.length && p < chEnd; r++) {
            const rc = rowCounts[r];
            const rowSrc = bytes.subarray(p, Math.min(p + rc, chEnd));
            const rowDst = unpacked.subarray(outOff, outOff + lw);
            unpackBits(rowSrc, rowDst);
            p += rc; outOff += lw;
          }
        } else if (compression === 2 || compression === 3) {
          // ZIP — use DecompressionStream if available
          try {
            if (typeof DecompressionStream !== 'undefined') {
              const compData = bytes.subarray(p, chEnd);
              const ds = new DecompressionStream('deflate-raw');
              const writer = ds.writable.getWriter();
              writer.write(compData); writer.close();
              const reader = ds.readable.getReader();
              const chunks = [];
              let done = false;
              while (!done) {
                const { value, done: d } = await reader.read();
                if (value) chunks.push(value);
                done = d;
              }
              let off = 0;
              for (const chunk of chunks) {
                if (bitDepth === 16) {
                  for (let i = 0; i < chunk.length && off < pixelCount; i += 2) unpacked[off++] = chunk[i];
                } else {
                  for (let i = 0; i < chunk.length && off < pixelCount; i++) unpacked[off++] = chunk[i];
                }
              }
            }
          } catch {}
        }

        decoded[String(ch.id)] = unpacked;
      }

      p = chEnd;
    }

    if (isTarget && lw > 0 && lh > 0 && decoded) {
      // Build RGBA canvas
      const r = decoded['0'] || new Uint8Array(lw * lh).fill(0);
      const g = decoded['1'] || r;
      const b = decoded['2'] || r;
      const a = decoded['-1'] || new Uint8Array(lw * lh).fill(255);

      const imgData = new ImageData(lw, lh);
      const px = imgData.data;
      for (let i = 0; i < lw * lh; i++) {
        px[i*4]   = r[i];
        px[i*4+1] = g[i];
        px[i*4+2] = b[i];
        px[i*4+3] = a[i];
      }
      const oc = document.createElement('canvas');
      oc.width = lw; oc.height = lh;
      oc.getContext('2d').putImageData(imgData, 0, 0);
      results[layer.id] = oc;
    }
  }

  return results;
}

// ══════════════════════════════════════════════════════════════════════════
// LAYER TREE
// ══════════════════════════════════════════════════════════════════════════
function buildTree(flat) {
  const stack = [], roots = [];
  for (const l of flat) {
    if (l.secType === 3) {
      stack.push({ ...l, children: [], isGroup: true });
    } else if (l.secType === 1 || l.secType === 2) {
      const g = stack.pop();
      if (g) { g.name = l.name; g.visible = l.visible; (stack[stack.length-1]?.children ?? roots).push(g); }
    } else {
      (stack[stack.length-1]?.children ?? roots).push({ ...l, children: [], isGroup: false });
    }
  }
  return roots;
}

function validateStructure(tree) {
  const fg = n => tree.find(x => x.isGroup && x.name.trim().toUpperCase() === n);
  const findBG = ns => { for (const n of ns) { if (!n.isGroup && n.name.trim().toUpperCase() === 'BG') return n; if (n.children) { const f = findBG(n.children); if (f) return f; } } return null; };
  const extras = fg('EXTRAS'), zonas = fg('ZONAS');
  const warnings = [];
  if (!extras) warnings.push('Sin carpeta EXTRAS');
  if (!zonas)  warnings.push('Sin carpeta ZONAS');
  if (!findBG(tree)) warnings.push('Sin capa BG de referencia');
  const extrasNode = extras || { id: -1, name: 'EXTRAS', children: [], isGroup: true };
  const zonasLayers = zonas ? zonas.children.filter(n => !n.isGroup) : [];
  const RESERVED = new Set(['EXTRAS', 'ZONAS', 'BG']);
  const ezFromZonas = zonas ? zonas.children.filter(n => n.isGroup) : [];
  const ezFromRoot  = tree.filter(n => n.isGroup && !RESERVED.has(n.name.trim().toUpperCase()));
  const seen = new Set();
  const enemyZones = [...ezFromZonas, ...ezFromRoot]
    .filter(z => { if (seen.has(z.id)) return false; seen.add(z.id); return true; })
    .map(z => {
      const directEnemies = z.children ? z.children.filter(n => !n.isGroup) : [];
      const subGroups = z.children ? z.children.filter(n => n.isGroup).map(sg => ({
        id: sg.id, name: sg.name,
        enemies: sg.children ? sg.children.filter(n => !n.isGroup) : []
      })) : [];
      const allEnemies = [...directEnemies, ...subGroups.flatMap(sg => sg.enemies)];
      return { id: z.id, name: z.name, enemies: allEnemies, directEnemies, subGroups };
    });
  return { warnings, structure: { extras: extrasNode, zonasLayers, enemyZones } };
}

function getBBox(points) {
  let left=Infinity, top=Infinity, right=-Infinity, bottom=-Infinity;
  for (const p of points) {
    if (p.x<left) left=p.x; if (p.x>right) right=p.x;
    if (p.y<top)  top=p.y;  if (p.y>bottom) bottom=p.y;
  }
  return { left, top, right, bottom, cx:(left+right)/2, cy:(top+bottom)/2, w:right-left, h:bottom-top };
}

// ── Noise library (prefijada tx_ para no colisionar) ─────────────────────
function txHash(x,y){const s=Math.sin(x*127.1+y*311.7)*43758.5453;return s-Math.floor(s);}
function txNoise(x,y){
  const ix=Math.floor(x),iy=Math.floor(y),fx=x-ix,fy=y-iy;
  const ux=fx*fx*(3-2*fx),uy=fy*fy*(3-2*fy);
  const a=txHash(ix,iy),b=txHash(ix+1,iy),c=txHash(ix,iy+1),d=txHash(ix+1,iy+1);
  return a+(b-a)*ux+(c-a)*uy+(a-b-c+d)*ux*uy;
}
function txFBM(x,y,oct=5){
  let v=0,a=0.5,f=1,mx=0;
  for(let i=0;i<oct;i++){v+=txNoise(x*f,y*f)*a;mx+=a;a*=0.5;f*=2;}
  return v/mx;
}
function txFBMD(x,y,oct=4){
  const ox=txFBM(x+1.7,y+9.2,oct),oy=txFBM(x+8.3,y+2.8,oct);
  return txFBM(x+2.5*ox,y+2.5*oy,oct);
}
function txWorley(x,y,t){
  const ix=Math.floor(x),iy=Math.floor(y);let f1=9,f2=9;
  for(let di=-1;di<=1;di++){for(let dj=-1;dj<=1;dj++){
    const ni=ix+di,nj=iy+dj,h1=txHash(ni,nj),h2=txHash(ni+97,nj+211);
    const cx=ni+h1+0.38*Math.sin(h1*63.1+t*0.7),cy=nj+h2+0.38*Math.cos(h2*79.3+t*0.55);
    const dx=x-cx,dy=y-cy,d=Math.sqrt(dx*dx+dy*dy);
    if(d<f1){f2=f1;f1=d;}else if(d<f2)f2=d;
  }}
  return {f1,f2,e:f2-f1};
}
function txNoise3D(x,y,z){
  const iz=Math.floor(z),fz=z-iz,ufz=fz*fz*(3-2*fz);
  return txNoise(x+iz*73.7,y+iz*47.1)*(1-ufz)+txNoise(x+(iz+1)*73.7,y+(iz+1)*47.1)*ufz;
}
function txFBM3D(x,y,z,oct=5){
  let v=0,a=0.5,f=1,mx=0;
  for(let i=0;i<oct;i++){v+=txNoise3D(x*f,y*f,z*f)*a;mx+=a;a*=0.5;f*=2;}
  return v/mx;
}
function txRidgedFBM(x,y,oct=7){
  // Ridged multifractal (Musgrave) → estructura tipo Lichtenberg
  let v=0,a=0.5,f=1,prev=1;
  for(let i=0;i<oct;i++){
    const n=txNoise(x*f,y*f);
    const ridge=1-Math.abs(n*2-1); // tent, pico en n=0.5
    const s=ridge*ridge*prev;
    v+=s*a;prev=s;a*=0.45;f*=2.1;
  }
  return v;
}

// ── Pixel functions ───────────────────────────────────────────────────────
// Cada una recibe (wx,wy) en coords de mundo / TSCALE, retorna [r,g,b,a]
const TSCALE=90; // píxeles de mapa por unidad de textura

function txMagma(wx,wy,t){
  const {f1,e}=txWorley(wx*1.7,wy*1.7,t*1.3);
  const flow=txFBMD(wx*.9+t*.28,wy*.9+t*.20);
  const detail=txFBM(wx*3.5-t*.15,wy*3.5+t*.10,3);
  const crack=Math.pow(Math.max(0,1-e*5.5),3)*1.4,glow=Math.pow(Math.max(0,1-f1*2.8),4)*.6;
  const v=Math.min(1,Math.max(0,crack+glow+flow*.35+detail*.15));
  let r,g,b;
  if      (v<.12){const k=v/.12;     r=8+12*k|0;  g=4+8*k|0;  b=3+5*k|0;}
  else if (v<.42){const k=(v-.12)/.3;r=20+195*k|0;g=12+18*k|0;b=8;}
  else if (v<.72){const k=(v-.42)/.3;r=215+40*k|0;g=30+120*k|0;b=8+5*k|0;}
  else           {const k=(v-.72)/.28;r=255;g=150+105*k|0;b=13+220*k|0;}
  return [r,g,b,148];
}

function txIce(wx,wy,t){
  const h=txFBMD(wx*1.6,wy*1.6);
  const c1=Math.abs(Math.sin(h*Math.PI*5));
  const vein=Math.pow(Math.max(0,1-c1*5),3.5);
  const block=txFBM(wx*.9,wy*.9,3)*.3;
  const sparkPh=txFBM(wx*7,wy*7,2)*Math.PI*8;
  const spark=Math.pow(Math.max(0,Math.sin(sparkPh+t*1.5)),12)*.9;
  const v=vein*.6+block+spark*.45;
  let r,g,b;
  if      (v<.18){r=195+block*20|0;g=228;b=248;}
  else if (v<.50){const k=(v-.18)/.32;r=195+45*k|0;g=228+18*k|0;b=248+7*k|0;}
  else if (v<.78){const k=(v-.50)/.28;r=240+12*k|0;g=246+9*k|0;b=255;}
  else           {const k=(v-.78)/.22;r=252+3*k|0;g=254;b=255;}
  return [r,g,b,148];
}

function txWater(wx,wy,t){
  let caustic=0;
  for(let i=0;i<3;i++){
    const ph=txFBM(wx*(1.2+i*.15)+i*5.1,wy*(1.2+i*.15)+i*3.7,3)*Math.PI*6;
    caustic+=Math.sin(ph+t*(1.1+i*.15))*.5+.5;
  }
  caustic=Math.pow(caustic/3,2.5);
  const depth=txFBMD(wx*.8,wy*.8);
  const ripple=txFBM(wx*1.4+t*.15,wy*1.4+t*.10,3);
  const v=Math.min(1,Math.max(0,caustic*.65+depth*.20+ripple*.20));
  let r,g,b;
  if      (v<.18){const k=v/.18;     r=2+8*k|0; g=18+40*k|0;b=55+80*k|0;}
  else if (v<.52){const k=(v-.18)/.34;r=10+35*k|0;g=58+110*k|0;b=135+75*k|0;}
  else if (v<.80){const k=(v-.52)/.28;r=45+155*k|0;g=168+72*k|0;b=210+35*k|0;}
  else           {const k=(v-.80)/.20;r=200+55*k|0;g=240+15*k|0;b=245+10*k|0;}
  return [r,g,b,148];
}

function txFire(wx,wy,t){
  const base=txFBM3D(wx*2,wy*2,t*.28,4);
  const detail=txFBM3D(wx*3.8,wy*3.8,t*.42,3);
  const wx2=wx+base*.6,wy2=wy+detail*.4;
  const core=txFBM3D(wx2*1.6,wy2*1.6,t*.32,3);
  const raw=base*.45+core*.38+detail*.17;
  const v=Math.min(1,Math.max(0,Math.pow(raw*1.7-.18,1.5)));
  let r,g,b;
  if      (v<.08){const k=v/.08;     r=3+10*k|0;  g=1+3*k|0;  b=0;}
  else if (v<.28){const k=(v-.08)/.2;r=13+202*k|0;g=4+22*k|0; b=0;}
  else if (v<.55){const k=(v-.28)/.27;r=215+40*k|0;g=26+148*k|0;b=0;}
  else if (v<.78){const k=(v-.55)/.23;r=255;g=174+72*k|0;b=14*k|0;}
  else           {const k=(v-.78)/.22;r=255;g=246+9*k|0;b=14+232*k|0;}
  return [r,g,b,152];
}

function txPoison(wx,wy,t){
  // Base sludge: slow undulating dark mass
  const sludge=txFBMD(wx*.9+t*.06,wy*.9+t*.045);
  // Toxic veins: warped ridged FBM → branching channels dripping poison
  const d1x=txFBM(wx*1.1,wy*1.1,3)*.9-.45;
  const d1y=txFBM(wx*1.1+3.3,wy*1.1+2.0,3)*.9-.45;
  const veins=txRidgedFBM(wx*1.3+d1x,wy*1.3+d1y,4);
  // Glowing toxic spots: slow-drifting bright green highlights
  const spots=txFBM(wx*2.4+t*.12,wy*2.4+t*.10,3);
  const glow=Math.pow(Math.max(0,spots-.52)/.48,2);
  // Drip streaks: vertical bias
  const drip=txFBM(wx*3.2+t*.10,wy*.6,2);
  const streak=Math.pow(Math.max(0,drip-.58)/.42,3);
  const v=Math.min(1,Math.max(0,sludge*.25+veins*.45+glow*.55+streak*.35));
  let r,g,b;
  if      (v<.10){const k=v/.10;     r=2+6*k|0;  g=10+22*k|0;b=1+4*k|0;}
  else if (v<.32){const k=(v-.10)/.22;r=8+22*k|0; g=32+68*k|0;b=5+10*k|0;}
  else if (v<.58){const k=(v-.32)/.26;r=30+55*k|0;g=100+110*k|0;b=15+18*k|0;}
  else if (v<.80){const k=(v-.58)/.22;r=85+100*k|0;g=210+35*k|0;b=33+55*k|0;}
  else           {const k=(v-.80)/.20;r=185+60*k|0;g=245+10*k|0;b=88+120*k|0;}
  return [r,g,b,155];
}

function txLightning(wx,wy,t){
  // Doble domain-warp → geometría jagged
  const s=.65;
  const d1x=txFBM(wx*s,      wy*s,      4)*2.4-1.2;
  const d1y=txFBM(wx*s+4.3,  wy*s+1.9,  4)*2.4-1.2;
  const d2x=txFBM(wx*s+d1x*.5,wy*s+d1y*.5,3)*1.6-.8;
  const d2y=txFBM(wx*s+d1x*.5+2,wy*s+d1y*.5,3)*1.6-.8;
  const bx=wx+d1x*1.0+d2x*.5, by=wy+d1y*1.0+d2y*.5;

  // Ridged multifractal = ramificaciones tipo Lichtenberg
  const ridge=txRidgedFBM(bx*1.3,by*1.3,5);

  // Núcleo fino + halo de glow
  const bolt=Math.pow(Math.max(0,ridge-.60)/.40,4);
  const glow=Math.pow(Math.max(0,ridge-.38)/.62,2)*.35;

  // Flicker por posición (sin traslación) — algo más lento
  const ph=ridge*32+txFBM(wx*.35,wy*.35,3)*18;
  const fl =Math.pow(Math.max(0,Math.sin(t*10+ph)),3);
  const fl2=Math.pow(Math.max(0,Math.sin(t*4+ph*.6)),2)*.5+.5;

  const v=bolt*fl+glow*fl2;
  if(v<.018) return [3,3,8,40];
  const k=Math.min(1,v);
  let r,g2,b,a;
  if      (k<.18){const t2=k/.18;     r=35+105*t2|0;g2=30+115*t2|0;b=3+8*t2|0;  a=90+115*t2|0;}
  else if (k<.48){const t2=(k-.18)/.3;r=140+100*t2|0;g2=145+100*t2|0;b=11+44*t2|0;a=205+30*t2|0;}
  else if (k<.78){const t2=(k-.48)/.3;r=240+15*t2|0;g2=245+10*t2|0;b=55+85*t2|0;a=235+15*t2|0;}
  else           {const t2=(k-.78)/.22;r=255;g2=255;b=140+90*t2|0;a=250+5*t2|0;}
  return [r,g2,b,a];
}

function txMagic(wx,wy,t,cx,cy){
  const rx=wx-cx,ry=wy-cy,dist=Math.sqrt(rx*rx+ry*ry);
  const ang=Math.atan2(ry,rx)+dist*.55+t*.45;
  const swx=Math.cos(ang)*dist+cx,swy=Math.sin(ang)*dist+cy;
  const vortex=txFBMD(swx*.82,swy*.82);
  const runePh=txFBM(wx*2.2,wy*2.2,4)*Math.PI*6;
  const rune=Math.abs(Math.sin(runePh+t*1.6));
  const {f1}=txWorley(wx*2,wy*2,t*.35);
  const sparkle=Math.pow(Math.max(0,1-f1*4.5),9)*(.5+.5*Math.sin(f1*95+t*5.5));
  const nebPh=txFBM(wx*1.4,wy*1.4,4)*Math.PI*4;
  const nebula=.5+.5*Math.sin(nebPh+t*1.0);
  const v=Math.min(1,Math.max(0,vortex*.38+rune*.24+sparkle*.65+nebula*.22));
  let r,g,b;
  if      (v<.14){const k=v/.14;     r=5+15*k|0;  g=0+5*k|0;  b=12+35*k|0;}
  else if (v<.38){const k=(v-.14)/.24;r=20+65*k|0;g=5+15*k|0;b=47+95*k|0;}
  else if (v<.62){const k=(v-.38)/.24;r=85+110*k|0;g=20+38*k|0;b=142+78*k|0;}
  else if (v<.82){const k=(v-.62)/.2;r=195+60*k|0;g=58+100*k|0;b=220+30*k|0;}
  else           {const k=(v-.82)/.18;r=255;g=158+90*k|0;b=250+5*k|0;}
  return [r,g,b,148];
}

// Mapa de funciones por elemento
const TX_FN = { fire:txFire, ice:txIce, water:txWater, poison:txPoison, lightning:txLightning, magic:txMagic };
// Para magma usamos txMagma (el elemento es 'fire' era el nombre antiguo, 'magma' no existe en ELEMENTS actual)

// Offscreen canvas reutilizable
const _txCanvas = document.createElement('canvas');
const _txCtx    = _txCanvas.getContext('2d');

// Zona plana para DM — solo color sin cálculo de textura
function drawFlatZone(ctx, zone) {
  const el = ELEMENTS_BY_ID.get(zone.element);
  const color = el ? el.color : '#ffffff';
  ctx.save();
  ctx.beginPath();
  zone.points.forEach((p,i) => i===0 ? ctx.moveTo(p.x,p.y) : ctx.lineTo(p.x,p.y));
  ctx.closePath();
  // Relleno semitransparente con el color del elemento
  ctx.fillStyle = color + '55';
  ctx.fill();
  // Contorno del polígono
  ctx.strokeStyle = color + 'cc';
  ctx.lineWidth = 1.5; ctx.setLineDash([]); ctx.lineJoin = 'round';
  ctx.beginPath();
  zone.points.forEach((p,i) => i===0 ? ctx.moveTo(p.x,p.y) : ctx.lineTo(p.x,p.y));
  ctx.closePath(); ctx.stroke();
  // Emoji del elemento centrado
  if (el) {
    const {cx,cy,w,h} = zone.bbox;
    const fontSize = Math.max(12, Math.min(w, h) * 0.18);
    ctx.font = `${fontSize}px system-ui`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.globalAlpha = 0.7;
    ctx.fillText(el.emoji, cx, cy);
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}

function drawPaintedZone(ctx, zone, t, txCache) {
  const {left,top,w,h,cx,cy}=zone.bbox;
  // Cuantizar el tiempo a 20fps para reusar texturas entre frames
  const tQ = Math.floor(t * 20) / 20;
  const cacheKey = zone.id + ':' + tQ;
  let cachedCanvas = txCache[cacheKey];
  if (!cachedCanvas) {
    // Desalojar frame anterior de esta zona
    for (const k of Object.keys(txCache)) { if (k.startsWith(zone.id + ':')) delete txCache[k]; }
    const pixelFn = TX_FN[zone.element] || txFire;
    const RS = Math.max(4, Math.ceil(Math.max(w,h)/120));
    const tw=Math.ceil(w/RS), th=Math.ceil(h/RS);
    const oc=document.createElement('canvas'); oc.width=tw; oc.height=th;
    const octx=oc.getContext('2d');
    const img=octx.createImageData(tw,th);
    const data=img.data;
    const tcx=cx/TSCALE, tcy=cy/TSCALE;
    for(let py=0;py<th;py++){
      for(let px=0;px<tw;px++){
        const wx=(left+px*RS)/TSCALE, wy=(top+py*RS)/TSCALE;
        const [r,g,b,a=255]=pixelFn(wx,wy,tQ,tcx,tcy);
        const i=(py*tw+px)*4;
        data[i]=r;data[i+1]=g;data[i+2]=b;data[i+3]=a;
      }
    }
    octx.putImageData(img,0,0);
    cachedCanvas = txCache[cacheKey] = oc;
  }
  // Clip al polígono y dibujar desde caché
  ctx.save();
  ctx.beginPath();
  zone.points.forEach((p,i)=>i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y));
  ctx.closePath();
  ctx.clip();
  ctx.imageSmoothingEnabled=true;
  ctx.imageSmoothingQuality='medium';
  ctx.drawImage(cachedCanvas,left,top,w,h);
  const el=ELEMENTS_BY_ID.get(zone.element);
  ctx.strokeStyle=el?el.color+'aa':'#ffffff88';
  ctx.lineWidth=1.5;ctx.setLineDash([]);ctx.lineJoin='round';
  ctx.beginPath();
  zone.points.forEach((p,i)=>i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y));
  ctx.closePath();ctx.stroke();
  ctx.restore();
}

// ── Reproducir un trazo en un canvas context ─────────────────────────────
function replayStroke(ctx2, stroke) {
  const pts = stroke.points; if (!pts || pts.length < 2) return;
  if (stroke.tool === 'pen') {
    ctx2.globalCompositeOperation = 'source-over';
    ctx2.strokeStyle = stroke.color; ctx2.lineWidth = stroke.size;
    ctx2.lineCap = 'round'; ctx2.lineJoin = 'round';
    ctx2.beginPath(); ctx2.moveTo(pts[0].x, pts[0].y);
    for (let i = 1; i < pts.length; i++) ctx2.lineTo(pts[i].x, pts[i].y);
    ctx2.stroke();
  } else {
    ctx2.globalCompositeOperation = 'destination-out';
    for (const pt of pts) { ctx2.beginPath(); ctx2.arc(pt.x, pt.y, stroke.size * 4, 0, Math.PI*2); ctx2.fill(); }
    ctx2.globalCompositeOperation = 'source-over';
  }
}


// ── Helpers de trayectoria ────────────────────────────────────────
function _pathLen(pts) {
  let l = 0;
  for (let i = 1; i < pts.length; i++) l += Math.hypot(pts[i].x-pts[i-1].x, pts[i].y-pts[i-1].y);
  return l;
}
function _pathAt(pts, t) {
  const total = _pathLen(pts);
  let target = Math.max(0, Math.min(1, t)) * total, covered = 0;
  for (let i = 1; i < pts.length; i++) {
    const d = Math.hypot(pts[i].x-pts[i-1].x, pts[i].y-pts[i-1].y);
    if (covered + d >= target) {
      const f = d > 0 ? (target - covered) / d : 0;
      return { x: pts[i-1].x + (pts[i].x-pts[i-1].x)*f, y: pts[i-1].y + (pts[i].y-pts[i-1].y)*f };
    }
    covered += d;
  }
  return pts[pts.length - 1];
}

// ── Bola de fuego ─────────────────────────────────────────────────
function drawSpellFireball(ctx, pts, elapsed, dur, sc) {
  ctx.save();
  const TRAVEL = dur * 0.72, IMPACT = dur - TRAVEL;
  if (elapsed <= TRAVEL) {
    const t   = elapsed / TRAVEL;
    const pos = _pathAt(pts, t);
    const tN  = performance.now() / 1000;
    // Cola
    for (let i = 1; i <= 14; i++) {
      const tt = Math.max(0, t - 0.13 * (1 - i/14));
      const tp = _pathAt(pts, tt);
      ctx.globalAlpha = (i/14) * 0.5;
      ctx.fillStyle   = i > 9 ? '#cc3300' : '#ff8800';
      ctx.beginPath(); ctx.arc(tp.x, tp.y, (2 + 8*(i/14)) / sc, 0, Math.PI*2); ctx.fill();
    }
    // Bola principal
    const pulse = 0.5 + 0.5 * Math.sin(tN * 20);
    const bR    = (8 + 3*pulse) / sc;
    ctx.globalAlpha = 1;
    ctx.shadowBlur  = 14 / sc; ctx.shadowColor = '#ff8800';
    ctx.fillStyle   = '#ffbb00'; ctx.beginPath(); ctx.arc(pos.x, pos.y, bR, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle   = '#ffeeaa'; ctx.beginPath(); ctx.arc(pos.x, pos.y, bR*0.35, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur  = 0;
  } else {
    // Impacto: solo anillos de onda, sin relleno blanco
    const imp  = (elapsed - TRAVEL) / IMPACT;
    const end  = pts[pts.length - 1];
    const fade = Math.max(0, 1 - imp);
    const mxR  = 48 / sc;
    ctx.lineCap = 'round';
    ctx.globalAlpha = fade * 0.65;
    ctx.strokeStyle = '#ff6600'; ctx.lineWidth = (5 * fade) / sc;
    ctx.beginPath(); ctx.arc(end.x, end.y, mxR * Math.min(1, imp * 1.8), 0, Math.PI*2); ctx.stroke();
    ctx.globalAlpha = fade * 0.45;
    ctx.strokeStyle = '#ffcc00'; ctx.lineWidth = (3 * fade) / sc;
    ctx.beginPath(); ctx.arc(end.x, end.y, mxR * Math.min(0.65, imp * 2.6) * 0.65, 0, Math.PI*2); ctx.stroke();
    ctx.globalAlpha = fade * 0.3;
    ctx.strokeStyle = '#ffeeaa'; ctx.lineWidth = (2 * fade) / sc;
    ctx.beginPath(); ctx.arc(end.x, end.y, mxR * Math.min(0.35, imp * 3.5) * 0.35, 0, Math.PI*2); ctx.stroke();
  }
  ctx.globalAlpha = 1; ctx.restore();
}

// ── Rayo eléctrico (paleta amarilla) ──────────────────────────────
function drawSpellLightning(ctx, pts, elapsed, dur, sc) {
  ctx.save();
  const tN   = performance.now();
  const fade = elapsed < 0.18 ? elapsed/0.18 : elapsed > dur-0.28 ? Math.max(0,(dur-elapsed)/0.28) : 1;
  if (fade < 0.01) { ctx.restore(); return; }
  // 3 capas: halo exterior amarillo oscuro, media naranja-amarillo, núcleo blanco
  const layers = [
    { lw: 9,   col: '#cc8800', a: 0.25 },
    { lw: 4,   col: '#ffd200', a: 0.60 },
    { lw: 1.5, col: '#ffffff', a: 0.95 },
  ];
  layers.forEach(({ lw, col, a }, li) => {
    const jitter = (2 - li) * 7 / sc;
    const pulse  = Math.max(0.2, 0.5 + 0.5 * Math.sin(tN * 0.013 + li * 1.7));
    ctx.globalAlpha = a * fade * pulse;
    ctx.strokeStyle = col; ctx.lineWidth = lw / sc;
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath();
    pts.forEach((p, i) => {
      const jx = (i > 0 && i < pts.length-1) ? Math.sin(tN * 0.09 + i*17.3 + li*5.1) * jitter : 0;
      const jy = (i > 0 && i < pts.length-1) ? Math.cos(tN * 0.09 + i*13.7 + li*3.9) * jitter : 0;
      i === 0 ? ctx.moveTo(p.x+jx, p.y+jy) : ctx.lineTo(p.x+jx, p.y+jy);
    });
    ctx.stroke();
  });
  // Chispas amarillas viajeras
  for (let s2 = 0; s2 < 5; s2++) {
    const sP = ((tN * 0.0025 + s2 * 0.19) % 1 + 1) % 1;
    const sp = _pathAt(pts, sP);
    ctx.globalAlpha = Math.sin(sP * Math.PI) * fade * 0.9;
    ctx.fillStyle = '#ffe066';
    ctx.beginPath(); ctx.arc(sp.x, sp.y, 3/sc, 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1; ctx.restore();
}

// ── Rayo mágico azul-violeta ──────────────────────────────────────
function drawSpellMagicBeam(ctx, pts, elapsed, dur, sc) {
  ctx.save();
  const BU = 0.55, FD = 0.42, HOLD = dur - FD;
  const phase = elapsed < BU ? elapsed/BU : 1;
  const alpha = elapsed < BU ? elapsed/BU : elapsed > HOLD ? Math.max(0,(dur-elapsed)/FD) : 1;
  if (alpha < 0.01) { ctx.restore(); return; }
  // Construir sub-path hasta `phase`
  const steps = Math.max(2, Math.ceil(pts.length * phase) + 1);
  const subPts = [];
  for (let i = 0; i < steps; i++) subPts.push(_pathAt(pts, Math.min(phase, i/(steps-1))));

  const drawBeamPath = (lw, col, a) => {
    ctx.globalAlpha = a * alpha; ctx.strokeStyle = col;
    ctx.lineWidth = lw/sc; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath();
    subPts.forEach((p,i) => i===0 ? ctx.moveTo(p.x,p.y) : ctx.lineTo(p.x,p.y));
    ctx.stroke();
  };
  drawBeamPath(22, '#3311aa', 0.20);  // halo exterior
  drawBeamPath(11, '#5533ee', 0.40);  // brillo medio
  drawBeamPath(4.5,'#8866ff', 0.75);  // cuerpo del rayo
  drawBeamPath(1.5,'#ddd8ff', 0.95);  // núcleo brillante

  // Destellos a lo largo del rayo
  const tN = performance.now() / 1000;
  for (let i2 = 0; i2 < 7; i2++) {
    const sT  = ((tN * 0.6 + i2 * 0.14) % Math.max(0.01, phase) + Math.max(0.01, phase)) % Math.max(0.01, phase);
    const sP2 = _pathAt(pts, sT);
    ctx.globalAlpha = Math.sin(sT / Math.max(0.01, phase) * Math.PI) * alpha * 0.85;
    ctx.fillStyle   = '#ffffff';
    const sr = (1.2 + 2.5 * Math.abs(Math.sin(tN * 5.1 + i2))) / sc;
    ctx.beginPath(); ctx.arc(sP2.x, sP2.y, sr, 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1; ctx.restore();
}

function pointInPolygon(x, y, polygon) {
  let inside=false, j=polygon.length-1;
  for (let i=0;i<polygon.length;i++) {
    const xi=polygon[i].x, yi=polygon[i].y, xj=polygon[j].x, yj=polygon[j].y;
    if (((yi>y)!==(yj>y)) && x<(xj-xi)*(y-yi)/(yj-yi)+xi) inside=!inside;
    j=i;
  }
  return inside;
}

const CONDITIONS = [
  { id:'grappled',      label:'Agarrado',     bg:'#6b7280', tint:null      },
  { id:'frightened',    label:'Asustado',     bg:'#7c3aed', tint:null      },
  { id:'stunned',       label:'Aturdido',     bg:'#ea580c', tint:'#f97316' },
  { id:'blinded',       label:'Cegado',       bg:'#374151', tint:null      },
  { id:'prone',         label:'Derribado',    bg:'#78350f', tint:null      },
  { id:'deafened',      label:'Ensordecido',  bg:'#9ca3af', tint:null      },
  { id:'poisoned',      label:'Envenenado',   bg:'#15803d', tint:'#22c55e' },
  { id:'charmed',       label:'Hechizado',    bg:'#be185d', tint:'#f472b6' },
  { id:'unconscious',   label:'Inconsciente', bg:'#1e293b', tint:'#475569' },
  { id:'invisible',     label:'Invisible',    bg:'#0369a1', tint:null      },
  { id:'paralyzed',     label:'Paralizado',   bg:'#a16207', tint:'#eab308' },
  { id:'petrified',     label:'Petrificado',  bg:'#57534e', tint:'#a8a29e' },
  { id:'restrained',    label:'Apresado',     bg:'#92400e', tint:null      },
  { id:'incapacitated', label:'Incapacitado', bg:'#991b1b', tint:null      },
];

function drawConditionSymbol(ctx, x, y, r, id) {
  const s = r * 0.52;
  ctx.fillStyle = '#fff'; ctx.strokeStyle = '#fff';
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.lineWidth = r * 0.16;
  switch (id) {
    case 'grappled': {
      ctx.lineWidth = r * 0.14;
      ctx.beginPath(); ctx.ellipse(x-s*0.32, y, s*0.36, s*0.58, Math.PI/4, 0, Math.PI*2); ctx.stroke();
      ctx.beginPath(); ctx.ellipse(x+s*0.32, y, s*0.36, s*0.58, Math.PI/4, 0, Math.PI*2); ctx.stroke();
      break;
    }
    case 'frightened': {
      ctx.fillRect(x-r*0.1, y-s*0.85, r*0.2, s*1.1);
      ctx.beginPath(); ctx.arc(x, y+s*0.65, r*0.14, 0, Math.PI*2); ctx.fill();
      break;
    }
    case 'stunned': {
      for (let i = 0; i < 3; i++) {
        const a = (i/3)*Math.PI*2 - Math.PI/2;
        const sx = x+Math.cos(a)*s*0.55, sy = y+Math.sin(a)*s*0.55;
        ctx.beginPath();
        for (let j = 0; j < 5; j++) {
          const ra = j*Math.PI*2/5 - Math.PI/2, rr = j%2===0 ? r*0.2 : r*0.09;
          j===0 ? ctx.moveTo(sx+Math.cos(ra)*rr, sy+Math.sin(ra)*rr) : ctx.lineTo(sx+Math.cos(ra)*rr, sy+Math.sin(ra)*rr);
        }
        ctx.closePath(); ctx.fill();
      }
      break;
    }
    case 'blinded': {
      ctx.lineWidth = r*0.14;
      ctx.beginPath(); ctx.ellipse(x, y-s*0.12, s*0.75, s*0.42, 0, 0, Math.PI*2); ctx.stroke();
      ctx.beginPath(); ctx.arc(x, y-s*0.12, s*0.22, 0, Math.PI*2); ctx.fill();
      ctx.lineWidth = r*0.2;
      ctx.beginPath(); ctx.moveTo(x-s*0.85, y+s*0.65); ctx.lineTo(x+s*0.85, y-s*0.65); ctx.stroke();
      break;
    }
    case 'prone': {
      ctx.beginPath();
      ctx.moveTo(x, y+s*0.9); ctx.lineTo(x-s*0.7, y-s*0.15);
      ctx.lineTo(x-s*0.2, y-s*0.15); ctx.lineTo(x-s*0.2, y-s*0.9);
      ctx.lineTo(x+s*0.2, y-s*0.9); ctx.lineTo(x+s*0.2, y-s*0.15);
      ctx.lineTo(x+s*0.7, y-s*0.15); ctx.closePath(); ctx.fill();
      break;
    }
    case 'deafened': {
      ctx.lineWidth = r*0.14;
      ctx.beginPath();
      ctx.arc(x+s*0.1, y-s*0.2, s*0.52, Math.PI*0.8, Math.PI*2.2);
      ctx.lineTo(x+s*0.62, y+s*0.45); ctx.lineTo(x+s*0.12, y+s*0.72); ctx.stroke();
      ctx.lineWidth = r*0.2;
      ctx.beginPath(); ctx.moveTo(x-s*0.8, y+s*0.7); ctx.lineTo(x+s*0.8, y-s*0.7); ctx.stroke();
      break;
    }
    case 'poisoned': {
      ctx.lineWidth = r*0.13;
      ctx.beginPath(); ctx.ellipse(x, y-s*0.18, s*0.63, s*0.58, 0, 0, Math.PI*2); ctx.stroke();
      ctx.fillRect(x-s*0.52, y+s*0.42, r*0.13, s*0.38);
      ctx.fillRect(x-s*0.18, y+s*0.42, r*0.13, s*0.38);
      ctx.fillRect(x+s*0.16, y+s*0.42, r*0.13, s*0.38);
      ctx.beginPath(); ctx.arc(x-s*0.28, y-s*0.28, r*0.14, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(x+s*0.28, y-s*0.28, r*0.14, 0, Math.PI*2); ctx.fill();
      break;
    }
    case 'charmed': {
      ctx.beginPath();
      ctx.moveTo(x, y+s*0.75);
      ctx.bezierCurveTo(x-s*1.0, y, x-s*1.0, y-s*0.6, x, y-s*0.1);
      ctx.bezierCurveTo(x+s*1.0, y-s*0.6, x+s*1.0, y, x, y+s*0.75);
      ctx.fill();
      break;
    }
    case 'unconscious': {
      ctx.font = `bold ${r*1.05}px system-ui`; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText('Z', x+s*0.3, y-s*0.3);
      ctx.font = `bold ${r*0.72}px system-ui`;
      ctx.fillText('z', x-s*0.15, y+s*0.45);
      ctx.textBaseline='alphabetic';
      break;
    }
    case 'invisible': {
      ctx.lineWidth = r*0.14;
      ctx.beginPath();
      ctx.arc(x, y-s*0.12, s*0.68, Math.PI, 0);
      ctx.lineTo(x+s*0.68, y+s*0.62);
      ctx.bezierCurveTo(x+s*0.38, y+s*0.32, x+s*0.08, y+s*0.68, x, y+s*0.44);
      ctx.bezierCurveTo(x-s*0.08, y+s*0.68, x-s*0.38, y+s*0.32, x-s*0.68, y+s*0.62);
      ctx.closePath(); ctx.stroke();
      ctx.beginPath(); ctx.arc(x-s*0.25, y-s*0.22, r*0.12, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(x+s*0.25, y-s*0.22, r*0.12, 0, Math.PI*2); ctx.fill();
      break;
    }
    case 'paralyzed': {
      ctx.beginPath();
      ctx.moveTo(x+s*0.25, y-s*0.95);
      ctx.lineTo(x-s*0.3,  y+s*0.05);
      ctx.lineTo(x+s*0.1,  y+s*0.05);
      ctx.lineTo(x-s*0.25, y+s*0.95);
      ctx.lineTo(x+s*0.3,  y-s*0.05);
      ctx.lineTo(x-s*0.1,  y-s*0.05);
      ctx.closePath(); ctx.fill();
      break;
    }
    case 'petrified': {
      ctx.beginPath();
      ctx.moveTo(x, y-s*0.9); ctx.lineTo(x+s*0.65, y-s*0.18);
      ctx.lineTo(x+s*0.65, y+s*0.18); ctx.lineTo(x, y+s*0.9);
      ctx.lineTo(x-s*0.65, y+s*0.18); ctx.lineTo(x-s*0.65, y-s*0.18);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle='rgba(0,0,0,0.22)';
      ctx.beginPath(); ctx.moveTo(x, y-s*0.9); ctx.lineTo(x+s*0.65, y-s*0.18); ctx.lineTo(x, y+s*0.18); ctx.closePath(); ctx.fill();
      break;
    }
    case 'restrained': {
      ctx.lineWidth = r*0.12;
      for (let i = 0; i < 4; i++) {
        const a = (i/4)*Math.PI;
        ctx.beginPath(); ctx.moveTo(x+Math.cos(a)*s*0.85, y+Math.sin(a)*s*0.85); ctx.lineTo(x+Math.cos(a+Math.PI)*s*0.85, y+Math.sin(a+Math.PI)*s*0.85); ctx.stroke();
      }
      [0.28, 0.58, 0.85].forEach(rr => { ctx.beginPath(); ctx.arc(x, y, s*rr, 0, Math.PI*2); ctx.stroke(); });
      break;
    }
    case 'incapacitated': {
      ctx.lineWidth = r*0.22;
      ctx.beginPath(); ctx.moveTo(x-s*0.7, y-s*0.7); ctx.lineTo(x+s*0.7, y+s*0.7); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x+s*0.7, y-s*0.7); ctx.lineTo(x-s*0.7, y+s*0.7); ctx.stroke();
      break;
    }
  }
}

function drawConditionBadges(ctx, cx, cy, R, condIds, sc) {
  if (!condIds || condIds.length === 0) return;
  const badgeR = Math.max(7/sc, R*0.28);
  const maxVis = 5, visible = condIds.slice(0, maxVis), extra = condIds.length - maxVis;
  const total = visible.length + (extra > 0 ? 1 : 0);
  const spacing = badgeR * 2.2;
  const startX = cx - ((total-1)*spacing)/2;
  const badgeY = cy - R - badgeR*1.3;
  visible.forEach((id, i) => {
    const cond = CONDITIONS_BY_ID.get(id); if (!cond) return;
    const bx = startX + i*spacing;
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.beginPath(); ctx.arc(bx+1/sc, badgeY+1/sc, badgeR, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = cond.bg;
    ctx.beginPath(); ctx.arc(bx, badgeY, badgeR, 0, Math.PI*2); ctx.fill();
    ctx.save(); drawConditionSymbol(ctx, bx, badgeY, badgeR, id); ctx.restore();
    ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.lineWidth = 0.8/sc;
    ctx.beginPath(); ctx.arc(bx, badgeY, badgeR, 0, Math.PI*2); ctx.stroke();
  });
  if (extra > 0) {
    const bx = startX + visible.length*spacing;
    ctx.fillStyle = '#374151';
    ctx.beginPath(); ctx.arc(bx, badgeY, badgeR, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = `bold ${badgeR*0.9}px system-ui`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(`+${extra}`, bx, badgeY); ctx.textBaseline = 'alphabetic';
  }
}

const TOKEN_LERP = 0.07; // interpolació posició de tokens (jugador)

function renderZoneOverlays(ctx, fc) {
  const { sc, ox, oy, s, v, pp, isDM, rLayerImages, rHoveredZone, zoneAnimRef } = fc;
      // ── Zone overlays ────────────────────────────────────────────────────
      const hovZ = rHoveredZone.current;
      s.zonasLayers.forEach(l => {
        const lp = pp[l.id] || { x: l.left + l.w/2, y: l.top + l.h/2 };
        const lx = lp.x - l.w/2, ly = lp.y - l.h/2;
        const isVis = !!v[l.id];
        const isHov = isDM && hovZ && hovZ.id === l.id;
        const imgs = rLayerImages.current;
        const layerImg = imgs[l.id];

        if (isDM) {
          if (isVis) {
            // Active → draw actual image (preserves gradients) or solid black
            if (layerImg) {
              ctx.globalAlpha = l.opacity / 255;
              ctx.drawImage(layerImg, lx, ly, l.w, l.h);
              ctx.globalAlpha = 1;
            } else {
              ctx.fillStyle = `rgba(0,0,0,${(l.opacity/255)*0.93})`;
              ctx.fillRect(lx, ly, l.w, l.h);
            }
            ctx.strokeStyle = 'rgba(255,255,255,0.15)';
            ctx.lineWidth = 1.5/sc;
            ctx.strokeRect(lx+0.5/sc, ly+0.5/sc, l.w-1/sc, l.h-1/sc);
          } else {
            ctx.setLineDash([8/sc, 4/sc]);
            ctx.strokeStyle = 'rgba(88,166,255,0.5)';
            ctx.lineWidth = 2/sc;
            ctx.strokeRect(lx, ly, l.w, l.h);
            ctx.setLineDash([]);
            ctx.fillStyle = 'rgba(88,166,255,0.05)';
            ctx.fillRect(lx, ly, l.w, l.h);
          }

          // Hover highlight (Change #4)
          if (isHov) {
            ctx.fillStyle = 'rgba(255,255,255,0.12)';
            ctx.fillRect(lx, ly, l.w, l.h);
            ctx.strokeStyle = 'rgba(255,255,255,0.7)';
            ctx.lineWidth = 2/sc;
            ctx.setLineDash([]);
            ctx.strokeRect(lx, ly, l.w, l.h);

            // Eye icon centered, drawn in screen space to keep consistent size
            const cx = lx + l.w/2, cy = ly + l.h/2;
            ctx.restore();
            // Switch to screen coords
            const scx = ox + cx*sc, scy = oy + cy*sc;
            const eyeR = 22;
            ctx.save();
            ctx.translate(scx, scy);

            // Background circle
            ctx.fillStyle = isVis ? 'rgba(255,255,255,0.9)' : 'rgba(30,30,30,0.85)';
            ctx.beginPath(); ctx.arc(0, 0, eyeR, 0, Math.PI*2); ctx.fill();
            ctx.strokeStyle = isVis ? 'rgba(0,0,0,0.3)' : 'rgba(255,255,255,0.5)';
            ctx.lineWidth = 1.5;
            ctx.stroke();

// CINEMATIC ENGINE — Boss Intro System                                  v2.10
// ─────────────────────────────────────────────────────────────────────────────
class CinematicTimeline {
  constructor(){ this._ev=[]; this._t0=null; this._run=false; }
  add(ms,fn){ this._ev.push({ms,fn,done:false}); return this; }
  play(){ this._ev.sort((a,b)=>a.ms-b.ms); this._ev.forEach(e=>e.done=false); this._t0=performance.now(); this._run=true; return this; }
  tick(){
    if(!this._run) return;
    const el=performance.now()-this._t0;
    for(const e of this._ev){ if(!e.done&&el>=e.ms){ e.done=true; try{e.fn(el);}catch(err){} } }
  }
  skip(){ this._run=false; }
}

const _CP_MAX=80;
const _cpPool=Array.from({length:_CP_MAX},()=>({alive:false,x:0,y:0,vx:0,vy:0,life:0,mxL:1,r:2,col:'#fff'}));
function _cpSpawn(x,y,vx,vy,life,r,col){
  const p=_cpPool.find(p=>!p.alive); if(!p) return;
  p.alive=true;p.x=x;p.y=y;p.vx=vx;p.vy=vy;p.life=life;p.mxL=life;p.r=r;p.col=col;
}
function _cpBurst(W,H,qty){
  const cols=['#d4a017','#ff9900','#ffd700'];
  for(let i=0;i<qty;i++){
    const col=cols[i%cols.length];
    const ang=Math.random()*Math.PI*2, spd=40+Math.random()*110;
    const x=W*(0.3+Math.random()*0.45), y=H*(0.25+Math.random()*0.5);
    _cpSpawn(x,y,Math.cos(ang)*spd,Math.sin(ang)*spd,0.6+Math.random()*1.1,1+Math.random()*2.5,col);
  }
}
function _cpUpdate(dt){
  for(const p of _cpPool){
    if(!p.alive) continue;
    p.x+=p.vx*dt; p.y+=p.vy*dt; p.life-=dt;
    if(p.life<=0){p.alive=false;continue;}
    p.vx*=Math.pow(0.97,dt*60); p.vy*=Math.pow(0.97,dt*60);
  }
}
function _cpDraw(ctx){
  for(const p of _cpPool){
    if(!p.alive) continue;
    const t=p.life/p.mxL;
    ctx.save();
    ctx.globalAlpha=t*0.85;
    ctx.shadowColor=p.col; ctx.shadowBlur=p.r*3;
    ctx.fillStyle=p.col;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r*t,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }
}
function _cpKill(){ _cpPool.forEach(p=>{p.alive=false;}); }

          if (msg.gridOriginY   !== undefined) { setGridOriginY(msg.gridOriginY);       rGridOriginY.current   = msg.gridOriginY; }

        } else if (msg.type === 'STATE') {

          if (msg.gridOriginX   !== undefined) { setGridOriginX(msg.gridOriginX);       rGridOriginX.current   = msg.gridOriginX; }
          if (msg.gridOriginY   !== undefined) { setGridOriginY(msg.gridOriginY);       rGridOriginY.current   = msg.gridOriginY; }
          if (msg.gridLineWidth   !== undefined) { setGridLineWidth(msg.gridLineWidth);     rGridLineWidth.current   = msg.gridLineWidth; }
          if (msg.enemyHighlight  !== undefined) { setEnemyHighlight(msg.enemyHighlight);   rEnemyHighlight.current  = msg.enemyHighlight; }
          if (msg.tokenSizeOverride !== undefined) { setTokenSizeOverride(msg.tokenSizeOverride); rTokenSizeOverride.current = msg.tokenSizeOverride; }

  // Send full state to player
  const _sendFullState = useCallback(() => {

    }

      pos: rPos.current,

      psdInfo: rPsdInfo.current,

      const ppos = pp[`pl_${pl.id}`] || { x: pl.x, y: pl.y };
      if (Math.hypot(mx - (ppos.x+22), my - (ppos.y+22)) <= 26) {
        dragRef.current = { id: `pl_${pl.id}`, ox: mx - ppos.x, oy: my - ppos.y };
        setActiveDrag(`pl_${pl.id}`);
        setSelectedToken(`pl_${pl.id}`); rSelectedToken.current = `pl_${pl.id}`;
        e.preventDefault(); return;
      }
    }

    // ── Enemies (priority 2 — always above zones) ───────────────────────
    const s = rStruct.current;
    if (s) {
      for (const zone of s.enemyZones) {
        for (let i = zone.enemies.length - 1; i >= 0; i--) {
          const en = zone.enemies[i];
          const ep = pp[en.id]; if (!ep) continue;
          if (!rVis.current[en.id] && !false) {/* invisible enemies still draggable by DM */}
          const R = rTokenSizeOverride.current[en.id] ?? Math.max(Math.min(en.w, en.h) / 2, 22);
          if (Math.hypot(mx - ep.x, my - ep.y) <= R) {
            dragRef.current = { id: en.id, ox: mx - ep.x, oy: my - ep.y };

    if (hovZ) {
      const { id, lx, ly, lw, lh } = hovZ;
      if (mx >= lx && mx <= lx+lw && my >= ly && my <= ly+lh) {
        const currentlyVisible = !!rVis.current[id];
        // Bloquear re-activar zona invisible si está en modo bloqueado
        if (rZonesLocked.current && !currentlyVisible) { e.preventDefault(); return; }
        const nvZone = { ...rVis.current, [id]: !rVis.current[id] };
        rVis.current = nvZone;
        setVis(nvZone);
        _broadcastState({});
        // Si se estaba desbloqueando para reactivar una zona invisible, volver a bloquear
        // SOLO si Ctrl no está pulsado (con Ctrl, permite activar múltiples zonas)
        if (!currentlyVisible && !rZonesLocked.current && !ctrlHeldRef.current) {

        }
        e.preventDefault(); return;
      }
    }
  }, [mapCoords, isPlayerWindow, _broadcastState]);

  const onMouseMove = useCallback((e) => {
    // Middle mouse pan (shared or private)
    if (panDragRef.current) {
      const { startX, startY, startPanX, startPanY, private: isPrivate } = panDragRef.current;

      if (isPrivate) {
        dmLocalPan.current = { x: nx, y: ny };
        setDmPrivateActive(true);
        const _now = Date.now();
        if (_now - dmPreviewBcastRef.current > 48) { dmPreviewBcastRef.current = _now; _broadcastState({}); }
      } else {
        rPanOffset.current = { x: nx, y: ny };
        _broadcastState({});
      }
      return;
    }

    const { mx, my } = mapCoords(e);
    // Calibración del grid: hover pre-drag + actualizar drag si activo
    if (!isPlayerWindow && rGridCalibrating.current) {
      gridCalibHoverRef.current = { hx: mx, hy: my };
      if (gridCalibRef.current) {
        gridCalibCurrRef.current = { cx: mx, cy: my };
        return;
      }
    }
    const tool = rDrawTool.current;

      if (s2) {
        // Check if cursor is over any enemy first → suppress zone hover
        let overEnemy = false;
        for (const zone of (s2.enemyZones || [])) {
          for (const en of zone.enemies) {
            const ep = rPos.current[en.id]; if (!ep) continue;
            const R = rTokenSizeOverride.current[en.id] ?? Math.max(Math.min(en.w, en.h) / 2, 22);
            if (Math.hypot(mx - ep.x, my - ep.y) <= R) { overEnemy = true; break; }
          }
          if (overEnemy) break;
        }

        let found = null;
        if (!overEnemy) {
          for (const l of (s2.zonasLayers || [])) {
            const lp = rPos.current[l.id] || { x: l.left+l.w/2, y: l.top+l.h/2 };
            const lx = lp.x - l.w/2, ly = lp.y - l.h/2;
            if (mx >= lx && mx <= lx+l.w && my >= ly && my <= ly+l.h) {

              const isInvis = !rVis.current[l.id];

    }

    // Puntero DM: emitir posición a jugadores
    if (!isPlayerWindow && tool === 'pointer') {

      if (now - pointerThrottleRef.current > 33) { // ~30fps

      }
      return;
    }

    // Mover zona pintada (Ctrl+shape drag)
    if (zoneDragRef.current) {
      const { zoneId, startMx, startMy, origPoints, origBbox } = zoneDragRef.current;
      const dx = mx - startMx, dy = my - startMy;
      const newPoints = origPoints.map(p => ({ x: p.x + dx, y: p.y + dy }));
      const nb = origBbox;
      const newBbox = { left: nb.left+dx, top: nb.top+dy, right: nb.right+dx, bottom: nb.bottom+dy, cx: nb.cx+dx, cy: nb.cy+dy, w: nb.w, h: nb.h };
      rPaintedZones.current = rPaintedZones.current.map(z => z.id === zoneId ? { ...z, points: newPoints, bbox: newBbox } : z);
      return;
    }

    // Shape drawing
    if (isShapeDrawingRef.current && tool === 'shape') {
      const pts = shapePointsRef.current;
      const last = pts[pts.length-1];
      // Throttle: only add point if moved enough (3px in map space)
      if (Math.hypot(mx-last.x, my-last.y) > 3/rZoom.current) {
        shapePointsRef.current = [...pts, { x:mx, y:my }];
      }
      return;
    }

    // Drawing
    if (isDrawingRef.current && (tool === 'pen' || tool === 'eraser')) {
      const oc = drawCanvasRef.current; if (!oc) return;
      const ctx2 = oc.getContext('2d');
      const last = lastDrawRef.current || { mx, my };
      if (tool === 'pen') {
        ctx2.globalCompositeOperation = 'source-over';
        ctx2.strokeStyle = rDrawColor.current; ctx2.lineWidth = rDrawSize.current;
        ctx2.lineCap = 'round'; ctx2.lineJoin = 'round';
        ctx2.beginPath(); ctx2.moveTo(last.mx, last.my); ctx2.lineTo(mx, my); ctx2.stroke();
      } else {
        ctx2.globalCompositeOperation = 'destination-out';

      lastDrawRef.current = { mx, my }; drawChangedRef.current = true;
      currentStrokeRef.current.push({ x: mx, y: my });
      return;
    }

    if (!dragRef.current) return;
    const { id, ox, oy } = dragRef.current;
    let np = { x: mx - ox, y: my - oy };
    if (rGridSnap.current && rGridSize.current > 0) {
      const gs  = rGridSize.current;
      const gox = ((rGridOriginX.current % gs) + gs) % gs;
      const goy = ((rGridOriginY.current % gs) + gs) % gs;
      // Snap al CENTRO de la celda más cercana (no a la intersección de líneas)
      const snapCC = (v, origin) => Math.round((v - origin - gs / 2) / gs) * gs + origin + gs / 2;
      const dragId = dragRef.current?.id;
      if (dragId && String(dragId).startsWith('pl_')) {
        // Token jugador: np es la esquina superior-izq, centro = np + R
        const R = rTokenSizeOverride.current[dragId] ?? 22;
        np = { x: snapCC(np.x + R, gox) - R, y: snapCC(np.y + R, goy) - R };
      } else {
        // Token enemigo: np ES el centro
        np = { x: snapCC(np.x, gox), y: snapCC(np.y, goy) };
      }
    }
    rPos.current = { ...rPos.current, [id]: np }; // setPos diferido a mouseUp
  }, [mapCoords, isPlayerWindow]);

  const onMouseUp = useCallback(() => {
    // ── Siempre limpiar pan y dibujo, sin importar qué herramienta ───────
    panDragRef.current    = null;
    isDrawingRef.current  = false;
    lastDrawRef.current   = null;

    // Calibración del grid: finalizar y aplicar
    if (!isPlayerWindow && rGridCalibrating.current && gridCalibRef.current && gridCalibCurrRef.current) {
      const { sx, sy } = gridCalibRef.current;
      const { cx, cy } = gridCalibCurrRef.current;
      const dx = cx - sx, dy = cy - sy;
      const sz = Math.max(8, Math.max(Math.abs(dx), Math.abs(dy)));
      const qx = dx >= 0 ? sx : sx - sz;
      const qy = dy >= 0 ? sy : sy - sz;
      const finalSz = Math.round(sz);
      rGridSize.current = finalSz;    setGridSize(finalSz);
      rGridOriginX.current = qx;      setGridOriginX(qx);
      rGridOriginY.current = qy;      setGridOriginY(qy);
      rGridCalibrating.current = false; setGridCalibrating(false);
      gridCalibRef.current = null; gridCalibCurrRef.current = null;
      if (rGridSnap.current) snapAllTokens();
      if (rGridAutoSize.current) sizeAllTokens();
      if (!rGridSnap.current && !rGridAutoSize.current) _broadcastState({});
      return;
    }

    // Finalizar drag de zona pintada
    if (zoneDragRef.current) {
      zoneDragRef.current = null;
      setPaintedZones([...rPaintedZones.current]);
      _broadcastState({});
      return;
    }

    // Shape tool: check if shape is closed
    if (isShapeDrawingRef.current) {
      isShapeDrawingRef.current = false;
      const pts = shapePointsRef.current;
      shapePointsRef.current = [];
      if (pts.length >= 3) {
        const first=pts[0], last=pts[pts.length-1];
        const { sc: sc2 } = mapCoords({ clientX:0, clientY:0 });
        const r2 = canvasRef.current.getBoundingClientRect();
        const m2 = mediaRef.current;
        let mw2=1920, mh2=1080;
        if (m2?.tagName==='IMG'   && m2.naturalWidth) { mw2=m2.naturalWidth;  mh2=m2.naturalHeight; }
        if (m2?.tagName==='VIDEO' && m2.videoWidth)   { mw2=m2.videoWidth;    mh2=m2.videoHeight; }
        const sc3 = Math.min(r2.width/mw2, r2.height/mh2) * rZoom.current;
        const closeDist = Math.hypot((last.x-first.x)*sc3, (last.y-first.y)*sc3);
        if (closeDist < 45 && pts.length >= 8) {
          const bbox = getBBox(pts);
          const pan = rPanOffset.current;
          const ox2 = (r2.width - mw2*sc3)/2 + pan.x, oy2 = (r2.height - mh2*sc3)/2 + pan.y;
          const cx_s = r2.left + ox2 + bbox.cx*sc3;
          const cy_s = r2.top  + oy2 + bbox.cy*sc3;
          setShapeMenu({ points: pts, bbox, cx: cx_s, cy: cy_s });
          return;
        }
        if (closeDist >= 45) {
          // Forma abierta → menú de hechizo
          const bbox2 = getBBox(pts);
          const pan2 = rPanOffset.current;
          const ox3 = (r2.width - mw2*sc3)/2 + pan2.x, oy3 = (r2.height - mh2*sc3)/2 + pan2.y;
          const cx_sp = r2.left + ox3 + bbox2.cx*sc3;
          const cy_sp = r2.top  + oy3 + bbox2.cy*sc3;

          return;

    }

    _broadcastState({});
  }, [_broadcastState]);

  const onMouseLeaveCanvas = useCallback(() => {

    }
  }, []);

  const addPaintedZone = useCallback((element) => {
    if (!shapeMenu) return;

      id: Date.now().toString(),
      element,
      points: shapeMenu.points,
      bbox: shapeMenu.bbox,
    };
    const npPz = [...rPaintedZones.current, zone];
    rPaintedZones.current = npPz;

    setShapeMenu(null);
    _broadcastState({});
  }, [shapeMenu, _broadcastState]);

  const deletePaintedZone = useCallback((id) => {

    _broadcastState({});
  }, [_broadcastState]);

  const clearPaintedZones = useCallback(() => {

    setPaintedZones([]);
    _broadcastState({});
  }, [_broadcastState]);

  const toggleCondition = useCallback((tokenId, condId) => {

    rConditions.current = ncCond;
    setConditions(ncCond);
    _broadcastState({});
  }, [_broadcastState]);

  const onContextMenu = useCallback((e) => {
    e.preventDefault();
    if (isPlayerWindow) return;
    const { mx, my } = mapCoords(e);
    const pp = rPos.current;
    // Check painted zones first (right-click to delete)
    for (const zone of rPaintedZones.current) {
      if (pointInPolygon(mx, my, zone.points)) {
        const el = ELEMENTS_BY_ID.get(zone.element);
        setContextMenu({ id: zone.id, name: `Zona: ${el?.label||zone.element}`, x: e.clientX, y: e.clientY, isPaintedZone: true });
        return;
      }
    }
    // Check players
    for (let i = rPlayers.current.length - 1; i >= 0; i--) {
      const pl = rPlayers.current[i];
      const ppos = pp[`pl_${pl.id}`] || { x: pl.x, y: pl.y };
      if (Math.hypot(mx-(ppos.x+22), my-(ppos.y+22)) <= 26) {
        setContextMenu({ id: `pl_${pl.id}`, name: pl.name, x: e.clientX, y: e.clientY });

      }
    }

    const s2 = rStruct.current; if (!s2) return;
    for (const zone of s2.enemyZones) {
      for (let i = zone.enemies.length - 1; i >= 0; i--) {
        const en = zone.enemies[i];
        const ep = pp[en.id]; if (!ep) continue;
        const R = rTokenSizeOverride.current[en.id] ?? Math.max(Math.min(en.w, en.h)/2, 22);
        if (Math.hypot(mx-ep.x, my-ep.y) <= R) {

  }, [contextMenu]);

  const resetToken = useCallback((en) => {
    const np = { x: en.left + en.w/2, y: en.top + en.h/2 };
    rPos.current = { ...rPos.current, [en.id]: np };
    setPos(p => ({ ...p, [en.id]: np }));
  }, []);

  const snapAllTokens = useCallback(() => {
    const gs = rGridSize.current;

    const goy = ((rGridOriginY.current % gs) + gs) % gs;
    const snapCC = (v, origin) => Math.round((v - origin - gs / 2) / gs) * gs + origin + gs / 2;
